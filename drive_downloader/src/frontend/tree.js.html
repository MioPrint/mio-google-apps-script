<script>
  // Pure Tree helpers: build a nested Tree from the flat Items the Tree
  // reader hands back in chunks, and flatten it into display rows. No
  // ports, no DOM (see docs/adr/0001-client-side-core.md).
  const FOLDER_MIME_TYPE = "application/vnd.google-apps.folder";

  const GOOGLE_MIME_TYPE_LABELS = {
    "application/vnd.google-apps.document": "Docs",
    "application/vnd.google-apps.spreadsheet": "Sheets",
    "application/vnd.google-apps.presentation": "Slides",
    "application/vnd.google-apps.form": "Forms",
    "application/vnd.google-apps.drawing": "Drawings",
    "application/vnd.google-apps.site": "Sites",
    "application/vnd.google-apps.shortcut": "Shortcut",
  };

  const EXTENSION_TYPE_LABELS = {
    jpg: "JPEG",
    jpeg: "JPEG",
    png: "PNG",
    gif: "GIF",
    pdf: "PDF",
    mp4: "MP4 video",
    mov: "MOV video",
    mkv: "MKV video",
    mp3: "MP3 audio",
    wav: "WAV audio",
    zip: "ZIP",
    txt: "Text",
    csv: "CSV",
    docx: "Word",
    xlsx: "Excel",
    pptx: "PowerPoint",
  };

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function extensionOf(name) {
    const i = name.lastIndexOf(".");
    return i > 0 ? name.slice(i + 1).toLowerCase() : "";
  }

  // A short label for the Type column. Shortcuts and Native Files still
  // show whatever Drive reports for them here; later tickets refine those
  // into "Sheets -> .xlsx" and "shortcut to a MP4 video" style labels.
  function typeLabel(item) {
    if (item.mimeType === FOLDER_MIME_TYPE) return "Folder";
    if (GOOGLE_MIME_TYPE_LABELS[item.mimeType])
      return GOOGLE_MIME_TYPE_LABELS[item.mimeType];
    const ext = extensionOf(item.name);
    if (EXTENSION_TYPE_LABELS[ext]) return EXTENSION_TYPE_LABELS[ext];
    return ext ? ext.toUpperCase() : "File";
  }

  const SIZE_UNITS = [
    [1024 ** 3, "GB", 2],
    [1024 ** 2, "MB", 1],
    [1024, "KB", 0],
  ];

  function formatBytes(bytes) {
    if (bytes == null) return "?";
    for (const [unit, label, digits] of SIZE_UNITS) {
      if (bytes >= unit) return `${(bytes / unit).toFixed(digits)} ${label}`;
    }
    return `${bytes} B`;
  }

  // Builds a nested Tree from a Source Folder plus the flat Items a Tree
  // reader chunk returns. Two passes, so item order never matters: a
  // child's own Item can arrive in an earlier or later chunk than its
  // parent folder's.
  function buildTree(folder, items) {
    const nodes = new Map();
    const root = {
      id: folder.id,
      name: folder.name,
      mimeType: FOLDER_MIME_TYPE,
      children: [],
    };
    nodes.set(folder.id, root);
    for (const item of items) {
      nodes.set(item.id, {
        ...item,
        children: item.mimeType === FOLDER_MIME_TYPE ? [] : undefined,
      });
    }
    for (const item of items) {
      const parent = nodes.get(item.parentId) || root;
      parent.children.push(nodes.get(item.id));
    }
    return root;
  }

  const SETTLED_STATUSES = new Set(["done", "exists", "failed"]);

  // A file Item's Run entry ({ status, received, phase, reason }): the
  // Run's own entry once one exists, else "unselected" for a file the
  // user has unticked, else the pending default before any Run.
  function itemOf(node, items, unselected) {
    if (items && items.has(node.id)) return items.get(node.id);
    if (unselected && unselected.has(node.id))
      return { status: "unselected", received: 0 };
    return { status: "pending", received: 0 };
  }

  // Sums a folder's descendant file sizes and counts its descendant files
  // (folders themselves aren't counted or sized), and how many of those
  // files the Run has settled. Unselected files drop out entirely, so
  // unticking narrows the totals rather than just excluding their bytes.
  function aggregateFolder(node, items, unselected) {
    let totalSize = 0;
    let hasUnknownSize = false;
    let fileCount = 0;
    let settledCount = 0;
    for (const child of node.children) {
      if (child.children) {
        const childAgg = aggregateFolder(child, items, unselected);
        totalSize += childAgg.totalSize;
        hasUnknownSize = hasUnknownSize || childAgg.hasUnknownSize;
        fileCount += childAgg.fileCount;
        settledCount += childAgg.settledCount;
      } else {
        const status = itemOf(child, items, unselected).status;
        if (status === "unselected") continue;
        fileCount += 1;
        if (SETTLED_STATUSES.has(status)) settledCount += 1;
        if (child.size == null) hasUnknownSize = true;
        else totalSize += child.size;
      }
    }
    return { totalSize, hasUnknownSize, fileCount, settledCount };
  }

  // "22.1 / 51.0 MB": the unit is written once when both sides share it.
  function formatProgress(received, size) {
    const [got, gotUnit] = formatBytes(received).split(" ");
    const [total, totalUnit] = formatBytes(size).split(" ");
    return gotUnit === totalUnit
      ? `${got} / ${total} ${totalUnit}`
      : `${formatBytes(received)} / ${formatBytes(size)}`;
  }

  function percentOf(received, size) {
    return size ? Math.floor((received / size) * 100) : 100;
  }

  // The retry countdown shown while item.phase is "waiting" (see
  // run.js): "retry 2/4 in 10 s" for a backoff Attempt (Retry-After
  // honoured there too), or a wait for the network to come back, which
  // spends no Attempt. An Attempt reset by progress (see run.js) is
  // labelled 1 again but can still carry a Retry-After wait; showing
  // "retry 0/4" there would be nonsense, so the retry number floors at 1.
  function retryText(item) {
    if (item.waitKind === "offline") return "waiting for the network…";
    const seconds = Math.round(item.waitMs / 1000);
    const retryNumber = Math.max(item.attempt - 1, 1);
    return `retry ${retryNumber}/4 in ${seconds} s`;
  }

  // A downloading file's bar: bytes while transferring, full while
  // finalizing, a retry countdown while waiting to retry, none while its
  // existence is being checked.
  function fileProgress(node, item) {
    if (item.status !== "downloading" || item.phase === "checking") return null;
    if (item.phase === "finalizing")
      return { fraction: 1, text: "finalizing…", title: "finalizing…" };
    if (item.phase === "waiting") {
      const text = retryText(item);
      return {
        fraction: node.size ? item.received / node.size : 1,
        text,
        title: text,
      };
    }
    return {
      fraction: node.size ? item.received / node.size : 1,
      text: formatProgress(item.received, node.size),
      title: `${formatBytes(item.received)} / ${formatBytes(node.size)} · ${percentOf(item.received, node.size)}%`,
    };
  }

  // One Drive-side display row. A folder row carries its totals whether
  // or not it is collapsed. view: { collapsed (folder ids), items (the
  // Run's per-file entries, or null before a Run), unselected (ids of
  // files the user has unticked) }.
  function driveRow(node, depth, isRoot, view) {
    const isFolder = !!node.children;
    const row = {
      id: node.id,
      depth,
      isFolder,
      name: node.name,
      typeLabel: typeLabel(node),
      selectionState: selectionState(node, view.unselected),
      selectionDisabled: selectableFileIds(node).length === 0,
    };
    if (isFolder) {
      const agg = aggregateFolder(node, view.items, view.unselected);
      row.sizeText =
        formatBytes(agg.totalSize) + (agg.hasUnknownSize ? "+" : "");
      row.statusText = isRoot
        ? "Source Folder"
        : `${agg.settledCount} / ${agg.fileCount} files`;
      row.hasChildren = node.children.length > 0;
      row.collapsed = view.collapsed.has(node.id);
    } else {
      const item = itemOf(node, view.items, view.unselected);
      row.sizeText = formatBytes(node.size);
      row.statusText = item.status;
      row.progress = fileProgress(node, item);
      if (item.reason && item.status === "failed") row.reason = item.reason;
    }
    return row;
  }

  // The overall bar: settled / files, and bytes done out of the bytes this
  // Run transfers (files found existing or failed drop out of both;
  // unselected files drop out of the file count too).
  function overallProgress(tree, items, unselected) {
    let files = 0;
    let settled = 0;
    let done = 0;
    let need = 0;
    let unknown = false;
    (function walk(node) {
      for (const child of node.children) {
        if (child.children) {
          walk(child);
          continue;
        }
        const item = itemOf(child, items, unselected);
        if (item.status === "unselected") continue;
        files += 1;
        if (SETTLED_STATUSES.has(item.status)) settled += 1;
        if (item.status === "exists" || item.status === "failed") continue;
        if (child.size == null) {
          unknown = true;
          continue;
        }
        need += child.size;
        if (item.status === "done") done += child.size;
        else if (item.status === "downloading") done += item.received;
      }
    })(tree);
    return {
      text: `${settled} / ${files} files · ${formatBytes(done)} / ${formatBytes(need)}${unknown ? "+" : ""}`,
      fraction: need
        ? Math.min(1, done / need)
        : files && settled === files
          ? 1
          : 0,
    };
  }

  // Every folder id under (not including) a Tree's root.
  function allFolderIds(root) {
    const ids = new Set();
    function walk(node) {
      for (const child of node.children) {
        if (child.children) {
          ids.add(child.id);
          walk(child);
        }
      }
    }
    walk(root);
    return ids;
  }

  // Selection: which files the Run will fetch. Folders have no selection
  // of their own; a folder's checkbox is only a view onto the selectable
  // files below it (see selectionState), and its own id never appears in
  // an "unselected" set.

  // A file that can be ticked or unticked: not a folder, and not flagged
  // as undownloadable. canDownload is the only such flag so far;
  // unsupported and loop arrive with Shortcuts and Native Files (11/12) -
  // once the Tree reader sets them, they disable the box here too.
  function isSelectableFile(node) {
    return (
      !node.children &&
      node.canDownload !== false &&
      !node.unsupported &&
      !node.loop
    );
  }

  // Every selectable file id in a node's own subtree (itself, if it is
  // one).
  function selectableFileIds(node) {
    if (!node.children) return isSelectableFile(node) ? [node.id] : [];
    const ids = [];
    for (const child of node.children) ids.push(...selectableFileIds(child));
    return ids;
  }

  // A node's checkbox state: "checked" when every selectable file below
  // it (itself, for a file) is ticked, "unchecked" when none are ticked
  // (including when there is nothing to tick), "mixed" when some are.
  function selectionState(node, unselected) {
    const ids = selectableFileIds(node);
    if (ids.length === 0) return "unchecked";
    const set = unselected || new Set();
    const tickedCount = ids.filter((id) => !set.has(id)).length;
    if (tickedCount === 0) return "unchecked";
    return tickedCount === ids.length ? "checked" : "mixed";
  }

  // Finds a node by id anywhere in a Tree, root included, or null.
  function findNode(root, id) {
    if (root.id === id) return root;
    if (!root.children) return null;
    for (const child of root.children) {
      const found = findNode(child, id);
      if (found) return found;
    }
    return null;
  }
</script>
