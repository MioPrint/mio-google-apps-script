<script>
  /* global driveNameTip, driveStatusTip */
  // Pure Tree helpers: build a nested Tree from the flat Items the Tree
  // reader hands back in chunks, and flatten it into display rows. No
  // ports, no DOM (see docs/adr/0001-client-side-core.md).
  const FOLDER_MIME_TYPE = "application/vnd.google-apps.folder";
  const SHORTCUT_MIME_TYPE = "application/vnd.google-apps.shortcut";
  const SHORTCUT_UNREACHABLE_REASON =
    "the Shortcut's target wasn't found, or you don't have access to it";
  const BLOCKED_BY_OWNER_REASON = "downloads disabled by owner";
  // "\u21aa " - the arrow-with-hook badge marking a Shortcut's type label.
  const SHORTCUT_BADGE = "\u21aa ";
  // "\u2192" - marks a Native File's Type label with what it exports to
  // ("Sheets \u2192 .xlsx" - ticket 12).
  const NATIVE_EXPORT_ARROW = " \u2192 ";

  const GOOGLE_MIME_TYPE_LABELS = {
    "application/vnd.google-apps.document": `Docs${NATIVE_EXPORT_ARROW}.docx`,
    "application/vnd.google-apps.spreadsheet": `Sheets${NATIVE_EXPORT_ARROW}.xlsx`,
    "application/vnd.google-apps.presentation": `Slides${NATIVE_EXPORT_ARROW}.pptx`,
    "application/vnd.google-apps.form": "Forms",
    "application/vnd.google-apps.drawing": "Drawings",
    "application/vnd.google-apps.site": "Sites",
    "application/vnd.google-apps.shortcut": "Shortcut",
  };

  // A Google Docs/Sheets/Slides mime type -> the Office format Drive
  // exports it to: the export request's target mimeType, and the
  // extension appended to its Local Name (ticket 12's Native File).
  const NATIVE_FILE_EXPORTS = {
    "application/vnd.google-apps.document": {
      exportMimeType:
        "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
      extension: ".docx",
    },
    "application/vnd.google-apps.spreadsheet": {
      exportMimeType:
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
      extension: ".xlsx",
    },
    "application/vnd.google-apps.presentation": {
      exportMimeType:
        "application/vnd.openxmlformats-officedocument.presentationml.presentation",
      extension: ".pptx",
    },
  };
  const GOOGLE_APPS_MIME_PREFIX = "application/vnd.google-apps.";

  // A Google Apps type Drive can't export: the same test TreeReader.js's
  // isUnsupportedGoogleType applies to a plain Item's own mimeType,
  // reapplied here for a Shortcut's resolved target - the backend never
  // flags this for a target, only fetching its name/mimeType/size (see
  // TreeReader.js's buildShortcutItem).
  function isUnsupportedGoogleType(mimeType) {
    return (
      mimeType.startsWith(GOOGLE_APPS_MIME_PREFIX) &&
      mimeType !== FOLDER_MIME_TYPE &&
      mimeType !== SHORTCUT_MIME_TYPE &&
      !NATIVE_FILE_EXPORTS[mimeType]
    );
  }

  const EXTENSION_TYPE_LABELS = {
    jpg: "JPEG",
    jpeg: "JPEG",
    png: "PNG",
    gif: "GIF",
    pdf: "PDF",
    mp4: "MP4 video",
    mov: "MOV video",
    mkv: "MKV video",
    mp3: "MP3 audio",
    wav: "WAV audio",
    zip: "ZIP",
    txt: "Text",
    csv: "CSV",
    docx: "Word",
    xlsx: "Excel",
    pptx: "PowerPoint",
  };

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function extensionOf(name) {
    const i = name.lastIndexOf(".");
    return i > 0 ? name.slice(i + 1).toLowerCase() : "";
  }

  // A short label for a row's type (kept for the name tooltip), describing the target for a
  // Shortcut ("MP4 video" for a Shortcut to an mp4 - node.mimeType/name
  // already take on the target's, see buildTree's nodeFromItem) with a
  // badge marking it as one ("\u21aa MP4 video"). A Native File shows what
  // it exports to ("Sheets \u2192 .xlsx" - see GOOGLE_MIME_TYPE_LABELS).
  function typeLabel(item) {
    const badge = item.isShortcut ? SHORTCUT_BADGE : "";
    if (item.mimeType === FOLDER_MIME_TYPE) return `${badge}Folder`;
    if (GOOGLE_MIME_TYPE_LABELS[item.mimeType])
      return badge + GOOGLE_MIME_TYPE_LABELS[item.mimeType];
    const ext = extensionOf(item.name);
    if (EXTENSION_TYPE_LABELS[ext]) return badge + EXTENSION_TYPE_LABELS[ext];
    return badge + (ext ? ext.toUpperCase() : "File");
  }

  const SIZE_UNITS = [
    [1024 ** 3, "GB", 2],
    [1024 ** 2, "MB", 1],
    [1024, "KB", 0],
  ];

  function formatBytes(bytes) {
    if (bytes == null) return "?";
    for (const [unit, label, digits] of SIZE_UNITS) {
      if (bytes >= unit) return `${(bytes / unit).toFixed(digits)} ${label}`;
    }
    return `${bytes} B`;
  }

  // Normalizes one flat Item (see TreeReader.js) into a Tree node. A
  // Shortcut node takes on its target's mimeType/size/resourceKey, so it
  // walks and downloads as the thing it points at (see run.js's own
  // driveId use); its own name survives as ownName alongside the target's
  // (name), so displayName can switch between them without a re-read. A
  // Shortcut whose target can't be reached, or that loops back into its
  // own ancestry, has no target to take on: it is built as a plain
  // (childless) leaf, like any other undownloadable Item, so it renders
  // and its checkbox disables (see isSelectableFile) without special
  // casing elsewhere.
  function nodeFromItem(item) {
    if (item.mimeType !== SHORTCUT_MIME_TYPE) {
      return {
        ...item,
        children: item.mimeType === FOLDER_MIME_TYPE ? [] : undefined,
      };
    }
    const base = {
      id: item.id,
      parentId: item.parentId,
      createdTime: item.createdTime,
      isShortcut: true,
      ownName: item.name,
      loop: !!item.loop,
      unreachable: !!item.unreachable,
    };
    const target = item.target;
    if (!target) {
      return {
        ...base,
        name: item.name,
        mimeType: item.mimeType,
        size: null,
        resourceKey: item.resourceKey,
        canDownload: true,
        children: undefined,
      };
    }
    const isFolderTarget = target.mimeType === FOLDER_MIME_TYPE;
    return {
      ...base,
      name: target.name,
      mimeType: target.mimeType,
      size: isFolderTarget ? null : target.size,
      resourceKey: target.resourceKey,
      driveId: target.id,
      canDownload: true,
      unsupported: isUnsupportedGoogleType(target.mimeType),
      children: isFolderTarget && !item.loop ? [] : undefined,
    };
  }

  // Builds a nested Tree from a Source Folder plus the flat Items a Tree
  // reader chunk returns. Two passes, so item order never matters: a
  // child's own Item can arrive in an earlier or later chunk than its
  // parent folder's.
  function buildTree(folder, items) {
    const nodes = new Map();
    const root = {
      id: folder.id,
      name: folder.name,
      mimeType: FOLDER_MIME_TYPE,
      children: [],
    };
    nodes.set(folder.id, root);
    for (const item of items) {
      nodes.set(item.id, nodeFromItem(item));
    }
    for (const item of items) {
      const parent = nodes.get(item.parentId) || root;
      parent.children.push(nodes.get(item.id));
    }
    return root;
  }

  // The Drive name a Shortcut's Tree label and Local Name are built from:
  // its own name, or its target's when "Use Shortcut target names" is on
  // (see naming.js's computeLocalNames and this file's driveRow). Every
  // other node just uses its own name. A Shortcut to a file whose chosen
  // name lacks the target's extension gets it appended ("Holiday video"
  // -> "clip.mp4" gives "Holiday video.mp4"); a Shortcut to a folder has
  // no extension to append - true of a loop too, a childless leaf (see
  // nodeFromItem) whose target is nonetheless always a folder (only a
  // folder can be an ancestor to loop back into), so it must be excluded
  // here the same as a real folder or its own name's last dot would be
  // mistaken for a file extension.
  function displayName(node, useShortcutTargetNames) {
    if (!node.isShortcut) return node.name;
    const chosen = useShortcutTargetNames ? node.name : node.ownName;
    if (node.children || node.loop) return chosen;
    const ext = extensionOf(node.name);
    if (!ext || chosen.toLowerCase().endsWith(`.${ext}`)) return chosen;
    return `${chosen}.${ext}`;
  }

  // "loop" and "unsupported" join the Run-settled statuses (see itemOf's
  // staticLeafStatus): both are known - and final - the moment Read
  // Drive returns, with no Run needed to settle them.
  const SETTLED_STATUSES = new Set([
    "done",
    "exists",
    "failed",
    "loop",
    "unsupported",
  ]);

  // A leaf's static Item Status, known from Read Drive alone rather than
  // a Run: "loop" for a Shortcut back into its own ancestry, "failed" for
  // one whose target Drive can't reach or whose owner disabled downloads,
  // "unsupported" for a Google Apps type Drive can't export - all
  // permanent, so the row (and its disabled checkbox - see
  // isSelectableFile) reflects them at once, before any Run. Every other
  // leaf falls through to itemOf's pending/unselected default.
  function staticLeafStatus(node) {
    if (node.loop) return { status: "loop", received: 0 };
    if (node.unreachable)
      return {
        status: "failed",
        received: 0,
        reason: SHORTCUT_UNREACHABLE_REASON,
      };
    if (node.unsupported) return { status: "unsupported", received: 0 };
    if (node.canDownload === false)
      return { status: "failed", received: 0, reason: BLOCKED_BY_OWNER_REASON };
    return null;
  }

  // A file Item's Run entry ({ status, received, phase, reason }): the
  // Run's own entry once one exists, else a static status already known
  // from Read Drive (see staticLeafStatus - loop/unsupported/blocked
  // always win, same order run.js's own per-file check uses), else this
  // render's Skip-existing preview entry when the file has a real local
  // match (see merge.js's previewExistsItems - ticket 16, wins over
  // "unselected" too), else "unselected" for a file the user has
  // unticked, else the pending default before any Run.
  function itemOf(node, items, unselected, previewExists) {
    if (items && items.has(node.id)) return items.get(node.id);
    const staticStatus = staticLeafStatus(node);
    if (staticStatus) return staticStatus;
    if (previewExists && previewExists.has(node.id))
      return previewExists.get(node.id);
    if (unselected && unselected.has(node.id))
      return { status: "unselected", received: 0 };
    return { status: "pending", received: 0 };
  }

  // A leaf's real size for totals and the Size column: Drive's own size
  // when it reports one, else (a Native File, whose size Drive never
  // reports - see CONTEXT.md) the real bytes written once it's done;
  // null while still unknown ("? until it's done" - ticket 12).
  function knownFileSize(node, item) {
    if (node.size != null) return node.size;
    // A Native File's real size, once its bytes are settled: done this
    // Run, or already sitting on disk and skipped as existing (run.js
    // records the on-disk size into item.received for "exists" too).
    return item.status === "done" || item.status === "exists"
      ? item.received
      : null;
  }

  // Sums a folder's descendant file sizes and counts its descendant files
  // (folders themselves aren't counted or sized), and how many of those
  // files the Run has settled. Unselected files drop out entirely, so
  // unticking narrows the totals rather than just excluding their bytes.
  function aggregateFolder(node, items, unselected, previewExists) {
    let totalSize = 0;
    let hasUnknownSize = false;
    let fileCount = 0;
    let settledCount = 0;
    for (const child of node.children) {
      if (child.children) {
        const childAgg = aggregateFolder(
          child,
          items,
          unselected,
          previewExists,
        );
        totalSize += childAgg.totalSize;
        hasUnknownSize = hasUnknownSize || childAgg.hasUnknownSize;
        fileCount += childAgg.fileCount;
        settledCount += childAgg.settledCount;
      } else {
        const item = itemOf(child, items, unselected, previewExists);
        const status = item.status;
        if (status === "unselected") continue;
        fileCount += 1;
        if (SETTLED_STATUSES.has(status)) settledCount += 1;
        const size = knownFileSize(child, item);
        if (size == null) {
          // A loop, an unreachable Shortcut or an unsupported type never
          // has bytes to count - not "unknown" (which implies a size
          // still to come, like a Native File mid-export), just none,
          // ever.
          if (
            status !== "loop" &&
            status !== "failed" &&
            status !== "unsupported"
          )
            hasUnknownSize = true;
        } else {
          totalSize += size;
        }
      }
    }
    return { totalSize, hasUnknownSize, fileCount, settledCount };
  }

  // "22.1 / 51.0 MB": the unit is written once when both sides share it.
  function formatProgress(received, size) {
    const [got, gotUnit] = formatBytes(received).split(" ");
    const [total, totalUnit] = formatBytes(size).split(" ");
    return gotUnit === totalUnit
      ? `${got} / ${total} ${totalUnit}`
      : `${formatBytes(received)} / ${formatBytes(size)}`;
  }

  function percentOf(received, size) {
    return size ? Math.floor((received / size) * 100) : 100;
  }

  // The retry countdown shown while item.phase is "waiting" (see
  // run.js): "retry 2/4 in 10 s" for a backoff Attempt (Retry-After
  // honoured there too), or a wait for the network to come back, which
  // spends no Attempt. An Attempt reset by progress (see run.js) is
  // labelled 1 again but can still carry a Retry-After wait; showing
  // "retry 0/4" there would be nonsense, so the retry number floors at 1.
  function retryText(item) {
    if (item.waitKind === "offline") return "waiting for the network…";
    const seconds = Math.round(item.waitMs / 1000);
    const retryNumber = Math.max(item.attempt - 1, 1);
    return `retry ${retryNumber}/4 in ${seconds} s`;
  }

  // A downloading file's bar: bytes while transferring, full while
  // finalizing, a retry countdown while waiting to retry, none while its
  // existence is being checked. detail is the same with percentage and
  // Attempt, for the Status tip. A Native File's size is never known until
  // it's done (see knownFileSize), so while it transfers the bar shows
  // bytes received only, no percentage (ticket 12).
  function fileProgress(node, item) {
    if (item.status !== "downloading" || item.phase === "checking") return null;
    if (item.phase === "finalizing")
      return { fraction: 1, text: "finalizing…", detail: "finalizing…" };
    if (item.phase === "waiting") {
      const text = retryText(item);
      return {
        fraction: node.size ? item.received / node.size : 1,
        text,
        detail: text,
      };
    }
    // The Attempt the transfer is on, once the Run has counted one.
    const attempt = item.attempt ? ` \u00b7 Attempt ${item.attempt}` : "";
    if (node.size == null) {
      const text = formatBytes(item.received);
      return { fraction: 1, text, detail: text + attempt };
    }
    return {
      // A genuinely 0-byte Drive file (size 0, not null) would otherwise
      // divide 0/0: fraction stays 1, matching a moment later when the
      // empty transfer settles done - never NaN in between.
      fraction: node.size ? item.received / node.size : 1,
      text: formatProgress(item.received, node.size),
      detail: `${formatBytes(item.received)} / ${formatBytes(node.size)} \u00b7 ${percentOf(item.received, node.size)}%${attempt}`,
    };
  }

  // One Drive-side display row. A folder row carries its totals whether
  // or not it is collapsed. view: { collapsed (folder ids), items (the
  // Run's per-file entries, or null before a Run), unselected (ids of
  // files the user has unticked), previewExists (this render's
  // Skip-existing preview entries, or null - ticket 16) }.
  function driveRow(node, depth, isRoot, view) {
    const isFolder = !!node.children;
    const row = {
      id: node.id,
      depth,
      isFolder,
      name: displayName(node, view.useShortcutTargetNames),
      typeLabel: typeLabel(node),
      isShortcut: !!node.isShortcut,
      selectionState: selectionState(node, view.unselected, view.previewExists),
      selectionDisabled:
        selectableFileIds(node, view.previewExists).length === 0,
    };
    // The other name a Shortcut isn't currently showing, for the row's
    // name tip (see tips.js's driveNameTip).
    if (node.isShortcut) {
      row.otherName = view.useShortcutTargetNames ? node.ownName : node.name;
    }
    if (isFolder) {
      const agg = aggregateFolder(
        node,
        view.items,
        view.unselected,
        view.previewExists,
      );
      row.sizeText =
        formatBytes(agg.totalSize) + (agg.hasUnknownSize ? "+" : "");
      row.statusText = isRoot
        ? "Source Folder"
        : `${agg.settledCount} / ${agg.fileCount} files`;
      row.hasChildren = node.children.length > 0;
      row.collapsed = view.collapsed.has(node.id);
      row.statusTip = driveStatusTip(row, isRoot, agg);
    } else {
      const item = itemOf(
        node,
        view.items,
        view.unselected,
        view.previewExists,
      );
      row.sizeText = formatBytes(knownFileSize(node, item));
      row.statusText = item.status;
      row.progress = fileProgress(node, item);
      // "exists" carries a reason only for the one case worth calling
      // out on hover: a file the Run found only because it appeared
      // after Download was pressed (see run.js's own check).
      if (item.reason && (item.status === "failed" || item.status === "exists"))
        row.reason = item.reason;
      row.statusTip = driveStatusTip(row, false);
    }
    row.nameTip = driveNameTip(row);
    return row;
  }

  // The overall bar: settled / files, and bytes done out of the bytes this
  // Run transfers (files found existing or failed drop out of both;
  // unselected files drop out of the file count too).
  function overallProgress(tree, items, unselected, previewExists) {
    let files = 0;
    let settled = 0;
    let done = 0;
    let need = 0;
    let unknown = false;
    (function walk(node) {
      for (const child of node.children) {
        if (child.children) {
          walk(child);
          continue;
        }
        const item = itemOf(child, items, unselected, previewExists);
        if (item.status === "unselected") continue;
        files += 1;
        if (SETTLED_STATUSES.has(item.status)) settled += 1;
        if (
          item.status === "exists" ||
          item.status === "failed" ||
          item.status === "loop" ||
          item.status === "unsupported"
        )
          continue;
        const size = knownFileSize(child, item);
        if (size == null) {
          unknown = true;
          continue;
        }
        need += size;
        if (item.status === "done") done += size;
        else if (item.status === "downloading") done += item.received;
      }
    })(tree);
    return {
      text: `${settled} / ${files} files · ${formatBytes(done)} / ${formatBytes(need)}${unknown ? "+" : ""}`,
      fraction: need
        ? Math.min(1, done / need)
        : files && settled === files
          ? 1
          : 0,
    };
  }

  // Every folder id under (not including) a Tree's root.
  function allFolderIds(root) {
    const ids = new Set();
    function walk(node) {
      for (const child of node.children) {
        if (child.children) {
          ids.add(child.id);
          walk(child);
        }
      }
    }
    walk(root);
    return ids;
  }

  // Selection: which files the Run will fetch. Folders have no selection
  // of their own; a folder's checkbox is only a view onto the selectable
  // files below it (see selectionState), and its own id never appears in
  // an "unselected" set.

  // A file that can be ticked or unticked: not a folder, and not flagged
  // as undownloadable - blocked by its owner, an unsupported Google Apps
  // type, or a Shortcut that loops back into its own ancestry or whose
  // target can't be reached - and not, while "Skip existing files" is on,
  // shown by this render's Skip-existing preview as already existing
  // (previewExists - ticket 16).
  function isSelectableFile(node, previewExists) {
    return (
      !node.children &&
      node.canDownload !== false &&
      !node.unsupported &&
      !node.loop &&
      !node.unreachable &&
      !(previewExists && previewExists.has(node.id))
    );
  }

  // Every selectable file id in a node's own subtree (itself, if it is
  // one).
  function selectableFileIds(node, previewExists) {
    if (!node.children)
      return isSelectableFile(node, previewExists) ? [node.id] : [];
    const ids = [];
    for (const child of node.children)
      ids.push(...selectableFileIds(child, previewExists));
    return ids;
  }

  // A node's checkbox state: "checked" when every selectable file below
  // it (itself, for a file) is ticked, "unchecked" when none are ticked
  // (including when there is nothing to tick), "mixed" when some are.
  function selectionState(node, unselected, previewExists) {
    const ids = selectableFileIds(node, previewExists);
    if (ids.length === 0) return "unchecked";
    const set = unselected || new Set();
    const tickedCount = ids.filter((id) => !set.has(id)).length;
    if (tickedCount === 0) return "unchecked";
    return tickedCount === ids.length ? "checked" : "mixed";
  }

  // Finds a node by id anywhere in a Tree, root included, or null.
  function findNode(root, id) {
    if (root.id === id) return root;
    if (!root.children) return null;
    for (const child of root.children) {
      const found = findNode(child, id);
      if (found) return found;
    }
    return null;
  }
</script>
