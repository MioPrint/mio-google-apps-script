<script>
  /* global driveRow, formatBytes, itemOf */
  // Merge: lines the Tree up with the scanned Target Folder, row by row,
  // each Drive Item beside the local item it will become, with a Result
  // per local item. No ports, no DOM (see
  // docs/adr/0001-client-side-core.md).
  //
  // A row is { left, right }: left a Drive row (see driveRow), right a
  // local row { depth, isFolder, name, sizeText, modifiedText, result,
  // planned, hasChildren, collapsed, driveToggle | localToggle }. Either
  // side is null where it has nothing. A local folder paired with a Drive
  // folder collapses with it (driveToggle, the Drive id); any other local
  // folder collapses on its own (localToggle, its path under the Target
  // Folder) and starts collapsed. view: { collapsed, expandedLocal, items
  // (the Run's per-file entries, or null before a Run), localNames (id ->
  // Local Name, see naming.js), unselected (ids of files the user has
  // unticked, see tree.js) }.
  const NAME_COLLATOR = new Intl.Collator(undefined, {
    numeric: true,
    sensitivity: "base",
  });

  // A settled file's Result, by its Item Status; hasExisting says there
  // was a real (non-empty-leftover) local file there when the Run
  // checked - see run.js's item.overwrite - so "done"/"failed" read as
  // "overwritten"/"kept" instead of "saved"/"not written". A loop never
  // writes either, same as a failure. null for a status with no Result
  // of its own (pending, unselected).
  function settledResult(status, hasExisting) {
    if (status === "downloading") return "writing";
    if (status === "exists") return "keep";
    if (status === "done") return hasExisting ? "overwritten" : "saved";
    if (status === "failed" || status === "loop" || status === "unsupported")
      return hasExisting ? "kept" : "not written";
    return null;
  }

  // Natural name order, ties broken by exact code point so the order is
  // stable across names that differ only in case.
  function compareNames(a, b) {
    return NAME_COLLATOR.compare(a, b) || (a < b ? -1 : a > b ? 1 : 0);
  }

  function compareLocalEntries(a, b) {
    if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
    return compareNames(a.name, b.name);
  }

  // A local item's path under the Target Folder ("" is the Target Folder).
  function childPath(parentPath, name) {
    return parentPath ? `${parentPath}/${name}` : name;
  }

  function pad2(n) {
    return String(n).padStart(2, "0");
  }

  function formatModified(ms) {
    if (ms == null) return "";
    const d = new Date(ms);
    return (
      `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ` +
      `${pad2(d.getHours())}:${pad2(d.getMinutes())}`
    );
  }

  // Pairs each Drive child with a local sibling of the same Local Name,
  // ignoring case. Exact-case matches are claimed first; otherwise the
  // first in name order wins. Unclaimed local siblings are local-only.
  function matchSiblings(driveChildren, localChildren, localNames) {
    const byLowerName = new Map();
    for (const local of [...localChildren].sort((a, b) =>
      compareNames(a.name, b.name),
    )) {
      const key = local.name.toLowerCase();
      if (!byLowerName.has(key)) byLowerName.set(key, []);
      byLowerName.get(key).push(local);
    }
    const matches = new Map();
    const claimed = new Set();
    const claim = (child, exactOnly) => {
      if (matches.has(child)) return;
      const name = localNames.get(child.id);
      const candidates = (byLowerName.get(name.toLowerCase()) || []).filter(
        (local) => !claimed.has(local),
      );
      const pick = exactOnly
        ? candidates.find((local) => local.name === name)
        : candidates[0];
      if (!pick) return;
      claimed.add(pick);
      matches.set(child, pick);
    };
    for (const child of driveChildren) claim(child, true);
    for (const child of driveChildren) claim(child, false);
    return {
      matches,
      unmatched: localChildren.filter((local) => !claimed.has(local)),
    };
  }

  function localRow(local, depth, result) {
    return {
      depth,
      isFolder: local.isFolder,
      name: local.name,
      sizeText: local.isFolder ? "" : formatBytes(local.size),
      modifiedText: formatModified(local.modified),
      result,
      planned: false,
    };
  }

  function mergeRows(tree, target, view) {
    const rows = [];
    // Absent from a view built before ticket 10 (target-folder.test.js's
    // fixtures) - treat that the same as the checkbox's own default, on.
    const skipExisting = view.skipExisting !== false;

    // A local folder not paired with a Drive folder collapses on its own.
    function ownToggle(local, path) {
      if (!local.isFolder) return {};
      return {
        hasChildren: local.children.length > 0,
        localToggle: path,
        collapsed: !view.expandedLocal.has(path),
      };
    }

    function emitLocalOnly(locals, depth, parentPath) {
      for (const local of [...locals].sort(compareLocalEntries)) {
        const path = childPath(parentPath, local.name);
        rows.push({
          left: null,
          right: {
            ...localRow(local, depth, "local only"),
            ...ownToggle(local, path),
          },
        });
        if (local.isFolder && view.expandedLocal.has(path)) {
          emitLocalOnly(local.children, depth + 1, path);
        }
      }
    }

    // The local side of a Drive Item: its match on disk, or the planned
    // item the Run will create.
    function rightFor(node, depth, local, path) {
      const isFolder = !!node.children;
      if (local && isFolder && local.isFolder) {
        return {
          ...localRow(local, depth, "matched"),
          hasChildren: node.children.length > 0 || local.children.length > 0,
          collapsed: view.collapsed.has(node.id),
          driveToggle: node.id,
        };
      }
      // An unticked file is left alone: "untouched" beside whatever is
      // already there, or no row at all when there's nothing to leave
      // alone (the Run was never going to write it).
      const item = !isFolder && itemOf(node, view.items, view.unselected);
      if (item && item.status === "unselected") {
        if (!local) return null;
        return {
          ...localRow(local, depth, "untouched"),
          ...ownToggle(local, path),
        };
      }
      // A local folder sitting where this file goes: skipping leaves it
      // ("keep", same as any other existing file); overwriting can't
      // write through a folder, so it fails instead ("in the way" - see
      // run.js's own check, which fails it the same way).
      if (!isFolder && local && local.isFolder) {
        return {
          ...localRow(local, depth, skipExisting ? "keep" : "in the way"),
          ...ownToggle(local, path),
        };
      }
      // A 0-byte local file stands in for a crashed earlier Run: it counts
      // as missing unless the Drive file is empty too.
      const emptyLeftover =
        local &&
        !isFolder &&
        !local.isFolder &&
        local.size === 0 &&
        node.size !== 0;
      // Whether the file the Run found - or, before/after a Run, the file
      // the merge finds now - was a real existing one: item.overwrite
      // (run.js's own record) once the Run has actually determined it,
      // since its local match may since have been overwritten in place;
      // otherwise (pending, no Run yet, or a file that failed before the
      // Run ever checked the disk - e.g. unsupported or a blocked
      // ancestor folder) the live match still reflects reality, since
      // nothing has touched it.
      const hasExisting =
        item && item.overwrite !== undefined
          ? item.overwrite
          : !isFolder && !!local && !emptyLeftover;
      const runResult = item && settledResult(item.status, hasExisting);
      // Once the Run has ended (finished, whether by completing or by
      // Stop), a file it never got to reads as a settled outcome, not a
      // still-pending prediction - the same outcome a failure would show
      // (nothing touched it either way), via settledResult("failed", ...).
      const afterRun = !skipExisting && view.runFinished;
      if (local && !(runResult === "not written" && emptyLeftover)) {
        const pendingResult = emptyLeftover
          ? "new"
          : !skipExisting && hasExisting
            ? afterRun
              ? settledResult("failed", true)
              : "overwrite"
            : "keep";
        return {
          ...localRow(local, depth, runResult || pendingResult),
          ...ownToggle(local, path),
        };
      }
      const planned = {
        depth,
        isFolder,
        name: local ? local.name : view.localNames.get(node.id),
        sizeText: isFolder ? "" : formatBytes(node.size),
        modifiedText: "",
        result: isFolder
          ? "new folder"
          : runResult || (afterRun ? settledResult("failed", false) : "new"),
        planned: true,
      };
      if (isFolder) {
        planned.hasChildren = node.children.length > 0;
        planned.collapsed = view.collapsed.has(node.id);
        planned.driveToggle = node.id;
      }
      return planned;
    }

    // local: the node's match on disk (undefined when none). parentPath:
    // the on-disk path of the parent's match, or null when the Target
    // Folder has nothing there (or no Target Folder is chosen).
    function walkDrive(node, depth, isRoot, local, parentPath) {
      const hasTarget = !!target;
      const path =
        local && parentPath !== null ? childPath(parentPath, local.name) : null;
      const left = driveRow(node, depth, isRoot, view);
      const right = hasTarget ? rightFor(node, depth + 1, local, path) : null;
      rows.push({ left, right });
      // A hover note for a file still pending: the merge already knows
      // what a Run reaching it right now would find, before the Item
      // Status itself says so (see run.js's own, live, per-file check).
      // Both notes read rightFor's own Result rather than re-deriving its
      // conditions (emptyLeftover, "overwrite") a second time here.
      if (
        !left.isFolder &&
        itemOf(node, view.items, view.unselected).status === "pending"
      ) {
        if (local && right && right.result === "new") {
          left.reason = "empty file will be replaced";
        } else if (right && right.result === "overwrite") {
          left.reason = "overwrites";
        }
      }
      const localFolder = local && local.isFolder ? local : null;
      if (!left.isFolder) {
        // A local folder sitting where a Drive file goes.
        if (localFolder && view.expandedLocal.has(path)) {
          emitLocalOnly(localFolder.children, depth + 2, path);
        }
        return;
      }
      if (left.collapsed) return;
      const { matches, unmatched } = matchSiblings(
        node.children,
        localFolder ? localFolder.children : [],
        view.localNames,
      );
      for (const child of node.children) {
        walkDrive(
          child,
          depth + 1,
          false,
          matches.get(child),
          localFolder ? path : null,
        );
      }
      if (localFolder) emitLocalOnly(unmatched, depth + 2, path);
    }

    if (target) {
      rows.push({
        left: null,
        right: {
          depth: 0,
          isFolder: true,
          name: target.name,
          sizeText: "",
          modifiedText: "",
          result: "target",
          planned: false,
        },
      });
    }
    let topLevelLocal = target ? target.children : [];
    if (tree) {
      const { matches, unmatched } = matchSiblings(
        [tree],
        topLevelLocal,
        view.localNames,
      );
      walkDrive(tree, 0, true, matches.get(tree), target ? "" : null);
      topLevelLocal = unmatched;
    }
    emitLocalOnly(topLevelLocal, 1, "");
    return rows;
  }

  // Every local folder's path under the Target Folder, for "Expand all".
  function allLocalFolderPaths(target) {
    const paths = new Set();
    function walk(folder, parentPath) {
      for (const child of folder.children) {
        if (!child.isFolder) continue;
        const path = childPath(parentPath, child.name);
        paths.add(path);
        walk(child, path);
      }
    }
    if (target) walk(target, "");
    return paths;
  }

  // Every file Item's real existing local match right now: id -> the
  // local entry, for a same-named file already on disk that isn't a
  // 0-byte leftover for a non-empty Drive file (see mergeRows' own
  // emptyLeftover). Used to plan a Download before a Run exists: the
  // overwrite count for the confirm dialog, and which ids were already on
  // disk when it was pressed (see run.js's own "appeared after Download"
  // check) - the same matching mergeRows itself uses to show "overwrite".
  function existingLocalMatches(tree, target, localNames) {
    const matches = new Map();
    function walk(node, local) {
      if (!node.children) {
        if (
          local &&
          !local.isFolder &&
          !(local.size === 0 && node.size !== 0)
        ) {
          matches.set(node.id, local);
        }
        return;
      }
      if (!local || !local.isFolder) return;
      const { matches: children } = matchSiblings(
        node.children,
        local.children,
        localNames,
      );
      for (const child of node.children) walk(child, children.get(child));
    }
    if (tree && target) {
      const { matches: root } = matchSiblings(
        [tree],
        target.children,
        localNames,
      );
      walk(tree, root.get(tree));
    }
    return matches;
  }
</script>
