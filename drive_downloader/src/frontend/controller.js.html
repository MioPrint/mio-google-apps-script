<script>
  /* global buildTree, allFolderIds, computeLocalNames, scanTargetFolder, mergeRows, allLocalFolderPaths, createRun, runDownload, overallProgress, formatProgress, formatBytes, percentOf, retryText, findNode, selectionState, selectableFileIds, existingLocalMatches, previewExistsItems, findOnDisk, unfetchableReason, matchSiblings */
  // Disk Window controller: owns app state and exposes commands to the
  // view, reaching the outside world only through injected ports (see
  // docs/adr/0001-client-side-core.md).
  const LAST_SOURCE_URL_STORAGE_KEY = "driveDownloader.lastSourceUrl";
  const REPLACE_SPACES_STORAGE_KEY = "driveDownloader.replaceSpaces";
  const KEEP_AWAKE_STORAGE_KEY = "driveDownloader.keepAwake";
  const USE_SHORTCUT_TARGET_NAMES_STORAGE_KEY =
    "driveDownloader.useShortcutTargetNames";

  const READ_DRIVE_ERROR_MESSAGES = {
    malformed:
      "That isn't a Google Drive folder URL. Paste a link like https://drive.google.com/drive/folders/...",
    notFound: "Folder not found, or you don't have access to it.",
    notAFolder: "That link opens a file, not a folder. Paste a folder URL.",
    empty: "That folder is empty. Nothing to download.",
  };

  const AUTHORIZATION_ERROR_MESSAGE =
    "Authorize the App in the Launcher Page tab, then press Read Drive again.";

  // GAS's Advanced Drive service throws this exact wording ("You do not
  // have permission to call drive.files.get.") when a scope hasn't been
  // authorized yet; matched case-insensitively since exact capitalization
  // isn't documented to be stable.
  function isAuthorizationError(error) {
    return /you do not have permission/i.test(errorText(error));
  }

  // Fallback for callers (tests, or a page with storage disabled) that
  // don't pass a real storage port.
  function createMemoryStorage() {
    const values = new Map();
    return {
      getItem: (key) => (values.has(key) ? values.get(key) : null),
      setItem: (key, value) => void values.set(key, value),
    };
  }

  const TARGET_PERMISSION_MESSAGE =
    "Chrome needs your permission again to use this folder. Press Refresh to allow it, or choose a folder with Local Target Folder.";

  function errorText(error) {
    return error && error.message ? error.message : String(error);
  }

  function targetReadErrorMessage(error) {
    const name = error && error.name;
    if (name === "NotFoundError")
      return "The Target Folder was moved or deleted. Choose it again with Local Target Folder.";
    if (name === "NotAllowedError" || name === "SecurityError")
      return "Lost permission to the Target Folder. Press Refresh to allow it again, or choose a folder with Local Target Folder.";
    return `Couldn't read the Target Folder: ${errorText(error)}. Press Refresh to try again, or choose a folder with Local Target Folder.`;
  }

  const NO_BROWSER_PORTS = {
    pickDirectory: () => Promise.reject(new Error("No folder picker")),
    handleStore: { get: async () => null, set: async () => {} },
    fetch: () => Promise.reject(new Error("No Drive")),
    now: () => Date.now(),
    chunkSize: null,
    onChange: () => {},
    wakeLock: { request: () => Promise.reject(new Error("No Wake Lock")) },
    onVisible: () => {},
    setTimeout: (fn, ms) => setTimeout(fn, ms),
    clearTimeout: (id) => clearTimeout(id),
    // No real navigator to ask, so assume online rather than reference
    // one and throw - "no browser" should fail safe, like every other
    // port here, not crash a Run that never needed a real one.
    isOnline: () => true,
    onOnline: () => () => {},
  };

  // Item Statuses in the order the Run summary lists them.
  const SUMMARY_STATUSES = ["done", "exists", "failed", "pending"];

  // Run states a Run reaches while runDownload is in flight; anything else
  // (idle/ready/finished) is worked out from state.tree/target/run instead.
  const ACTIVE_RUN_STATUSES = new Set([
    "running",
    "pausing",
    "paused",
    "stopping",
  ]);

  // browser: { pickDirectory(startIn) -> directory handle (the folder
  // picker), handleStore: { get(), set(handle) } (the remembered Target
  // Folder, IndexedDB in the browser), fetch(url, init) (the Drive port),
  // now() -> epoch ms, chunkSize (bytes per ranged request; the Run's
  // default when unset), onChange() (called when state moves on without
  // a command, e.g. scan or Run progress), wakeLock: { request() -> a
  // sentinel with release() } (the Screen Wake Lock), onVisible(fn)
  // (registers fn to run when the page becomes visible again) }.
  function createController(serverPort, storage, browser) {
    const store = storage || createMemoryStorage();
    const ports = { ...NO_BROWSER_PORTS, ...browser };
    const notify = () => ports.onChange && ports.onChange();
    const state = {
      url: store.getItem(LAST_SOURCE_URL_STORAGE_KEY) || "",
      urlError: null,
      reading: false,
      tree: null,
      collapsed: new Set(),
      unselected: new Set(), // ids of files the user has unticked
      targetHandle: null,
      target: null, // the scanned local tree; null until read, or after a failed read
      targetError: null,
      scanCount: null, // items read so far while a scan runs, else null
      scanId: 0,
      expandedLocal: new Set(),
      skipExisting: true, // starts checked on every visit, never remembered
      replaceSpaces: store.getItem(REPLACE_SPACES_STORAGE_KEY) === "true",
      useShortcutTargetNames:
        store.getItem(USE_SHORTCUT_TARGET_NAMES_STORAGE_KEY) === "true", // off by default
      keepAwake: store.getItem(KEEP_AWAKE_STORAGE_KEY) !== "false",
      run: null, // the current or last Run (see run.js), null before one
      // Set between Download and Continue/Cancel when overwrites are
      // pending: pendingOverwriteCount the N shown in the confirm dialog,
      // pendingKnownExisting the ids it counted (see run.js's own
      // knownExisting) - carried through to the Run started on Continue,
      // not recomputed, so what runs matches what was confirmed.
      pendingOverwriteCount: null,
      pendingKnownExisting: null,
      // True for download()'s own re-scan and re-merge, before it knows
      // whether a confirm is even needed - locks the same way "confirming"
      // does (isLocked, runState), so a second Download press, or the
      // Tree/Target/selection changing underneath, can't land mid-rescan.
      startingDownload: false,
    };
    // Local Names for state.tree at its current state.replaceSpaces;
    // null when stale (a new Tree, or the option toggled) or unread.
    let localNamesCache = null;
    let wakeLockSentinel = null;
    let acquiringWakeLock = false;

    // Run states: idle (no Tree or no folder) → ready → confirming
    // (Download pressed with overwrites pending) → running ⇄ paused →
    // stopping → finished (ready plus the last Run's statuses and
    // summary). "pausing" (Pause pressed, or a disk error, but not yet
    // noticed at a checkpoint) reads as "running" here; the status line
    // still says "Pausing…" (see statusLine).
    function runState() {
      if (state.startingDownload || state.pendingOverwriteCount !== null)
        return "confirming";
      if (state.run) {
        if (state.run.status === "paused") return "paused";
        if (state.run.status === "stopping") return "stopping";
        if (state.run.status === "finished") return "finished";
        return "running"; // "running" or "pausing"
      }
      if (
        !state.tree ||
        !state.target ||
        state.reading ||
        state.scanCount !== null
      )
        return "idle";
      return "ready";
    }

    // Locked the same way an active Run locks the URL, Read Drive,
    // Location and options: also while starting a Download (its own
    // rescan/re-merge, before it knows whether a confirm is even needed)
    // or while the confirm dialog is up, so the Tree/Target/selection a
    // pending overwrite count and plan were computed from can't change
    // underneath it.
    function isLocked() {
      return (
        (!!state.run && ACTIVE_RUN_STATUSES.has(state.run.status)) ||
        state.startingDownload ||
        state.pendingOverwriteCount !== null
      );
    }

    async function acquireWakeLock() {
      if (!state.keepAwake || runState() !== "running") return;
      if (wakeLockSentinel || acquiringWakeLock) return;
      acquiringWakeLock = true;
      try {
        const sentinel = await ports.wakeLock.request();
        wakeLockSentinel = sentinel;
        // Chrome releases it unasked when the tab is hidden; without this,
        // a later visibility return would see the (now stale) sentinel and
        // skip re-acquiring it.
        if (sentinel && sentinel.addEventListener) {
          sentinel.addEventListener("release", () => {
            if (wakeLockSentinel === sentinel) wakeLockSentinel = null;
            notify();
          });
        }
      } catch {
        wakeLockSentinel = null; // unsupported, or the user declined
      } finally {
        acquiringWakeLock = false;
      }
      notify();
    }

    async function releaseWakeLock() {
      if (!wakeLockSentinel) return;
      const sentinel = wakeLockSentinel;
      wakeLockSentinel = null;
      try {
        await sentinel.release();
      } catch {
        // Already released (e.g. the browser did it when the tab hid).
      }
      notify();
    }

    ports.onVisible(() => {
      if (state.keepAwake && runState() === "running") return acquireWakeLock();
      return undefined;
    });

    function setUrl(url) {
      if (isLocked()) return;
      state.url = url;
      state.urlError = null;
    }

    async function readDrive() {
      if (isLocked()) return;
      state.reading = true;
      state.urlError = null;
      state.tree = null;
      state.run = null;
      localNamesCache = null;
      try {
        const start = await serverPort("treeReaderStart", state.url);
        if (start.error) {
          state.urlError = READ_DRIVE_ERROR_MESSAGES[start.error];
          return;
        }
        store.setItem(LAST_SOURCE_URL_STORAGE_KEY, state.url);
        const items = [];
        let continuation = start.continuation;
        while (continuation) {
          const chunk = await serverPort("treeReaderStep", continuation);
          items.push(...chunk.items);
          continuation = chunk.continuation;
        }
        state.collapsed = new Set();
        state.unselected = new Set(); // every Item starts ticked
        state.tree = buildTree(start.folder, items);
      } catch (error) {
        state.urlError = isAuthorizationError(error)
          ? AUTHORIZATION_ERROR_MESSAGE
          : `Couldn't read Drive: ${errorText(error)}`;
      } finally {
        state.reading = false;
      }
    }

    // Reads the whole Target Folder. A newer scan (re-pick, Refresh) makes
    // an older one's result stale; only the latest is kept.
    async function scanTarget() {
      const scanId = ++state.scanId;
      state.target = null;
      state.targetError = null;
      state.scanCount = 0;
      try {
        const target = await scanTargetFolder(state.targetHandle, (count) => {
          if (scanId !== state.scanId) return;
          state.scanCount = count;
          notify();
        });
        if (scanId === state.scanId) state.target = target;
      } catch (error) {
        if (scanId === state.scanId)
          state.targetError = targetReadErrorMessage(error);
      } finally {
        if (scanId === state.scanId) state.scanCount = null;
      }
    }

    // Brings back the Target Folder chosen on an earlier visit. It is
    // read only if Chrome still grants access; otherwise asking again
    // needs a click (Refresh), since permission prompts need one.
    async function restoreLocation() {
      let handle;
      try {
        handle = await ports.handleStore.get();
      } catch {
        return;
      }
      if (!handle || state.targetHandle) return;
      state.targetHandle = handle;
      let permission;
      try {
        permission = await handle.queryPermission({ mode: "readwrite" });
      } catch (error) {
        state.targetError = targetReadErrorMessage(error);
        return;
      }
      if (permission === "granted") await scanTarget();
      else state.targetError = TARGET_PERMISSION_MESSAGE;
    }

    async function chooseLocation() {
      if (isLocked()) return;
      let handle;
      try {
        handle = await ports.pickDirectory(state.targetHandle || "downloads");
      } catch (error) {
        if (error && error.name === "AbortError") return;
        state.targetError = `Couldn't open that folder: ${errorText(error)}`;
        return;
      }
      state.targetHandle = handle;
      state.expandedLocal = new Set();
      // A new Target Folder starts from ready: the last Run's statuses and
      // Results describe the old one.
      state.run = null;
      try {
        await ports.handleStore.set(handle);
      } catch {
        // Remembering the folder is a convenience; the pick still stands.
      }
      await scanTarget();
    }

    // Re-reads the whole Target Folder. The click also re-requests
    // permission, which Chrome only allows from a user gesture.
    async function refreshTarget() {
      if (!state.targetHandle || isLocked()) return;
      let permission;
      try {
        permission = await state.targetHandle.requestPermission({
          mode: "readwrite",
        });
      } catch (error) {
        state.target = null;
        state.targetError = targetReadErrorMessage(error);
        return;
      }
      if (permission !== "granted") {
        state.target = null;
        state.targetError = TARGET_PERMISSION_MESSAGE;
        return;
      }
      await scanTarget();
    }

    // Recomputes Results without touching the disk, like the naming
    // options; drops a `finished` Run's statuses, returning to `ready`.
    function setSkipExisting(checked) {
      if (isLocked()) return;
      state.skipExisting = checked;
      state.run = null;
    }

    // Ticks or unticks every selectable file under an Item (itself, for a
    // file), the way a folder's checkbox ticks or clears its whole branch.
    // A checked Item is unticked; a mixed or unticked one is ticked, so a
    // click always leaves the branch uniform. A file the Skip-existing
    // preview shows as "exists" isn't selectable, so a folder click skips
    // over it (ticket 16), same as one blocked outright. Locked during a
    // Run; like the naming options, it recomputes Results without
    // touching the disk and drops a `finished` Run's statuses, returning
    // to `ready`.
    function toggleSelected(id) {
      if (isLocked() || !state.tree) return;
      const node = findNode(state.tree, id);
      if (!node) return;
      const previewExists = currentPreviewExists();
      const ids = selectableFileIds(node, previewExists);
      if (ids.length === 0) return;
      const tick =
        selectionState(node, state.unselected, previewExists) !== "checked";
      for (const fileId of ids) {
        if (tick) state.unselected.delete(fileId);
        else state.unselected.add(fileId);
      }
      state.run = null;
    }

    // Every node's Local Name for the current Tree, cached until state.tree,
    // state.replaceSpaces or state.useShortcutTargetNames changes (readDrive
    // and the two setters below clear localNamesCache) — getViewModel()
    // calls this on every render, including every progress tick of a Run,
    // so a full Tree walk here would repeat needlessly for the Run's whole
    // duration.
    function localNames() {
      if (!state.tree) return new Map();
      if (!localNamesCache)
        localNamesCache = computeLocalNames(
          state.tree,
          state.replaceSpaces,
          state.useShortcutTargetNames,
        );
      return localNamesCache;
    }

    // Ticket 16's Skip-existing preview: every Drive file "Skip existing
    // files" would skip as exists, recomputed here from the current
    // Tree/Target/naming on every call - readDrive, a target scan,
    // toggling a naming option or the Skip option itself all drop
    // state.run (see their own setters), so this always reflects what's
    // current. null while a Run is actually in flight (ACTIVE_RUN_STATUSES,
    // same set isLocked() uses): state.run.items already carries a real
    // status, including its own "exists", for every file then (see
    // itemOf), so recomputing here too would be wasted work on every
    // progress tick. A *finished* Run doesn't suppress it, though -
    // itemOf still prefers state.run.items over this for display (items
    // is checked first), but toggleSelected's own selectableFileIds/
    // selectionState calls have no other way to see "exists" and keep a
    // file the Run itself skipped out of a folder click once the Run
    // has ended. Also null with the option off, or before both a Tree
    // and a Target Folder are read.
    function currentPreviewExists() {
      if (
        (state.run && ACTIVE_RUN_STATUSES.has(state.run.status)) ||
        !state.skipExisting ||
        !state.tree ||
        !state.target
      )
        return null;
      return previewExistsItems(state.tree, state.target, localNames());
    }

    // Toggling outside a Run recomputes Local Names and re-merges Results
    // without touching the disk; after `finished` it drops the last Run's
    // statuses, returning to `ready`.
    function setReplaceSpaces(checked) {
      if (isLocked()) return;
      state.replaceSpaces = checked;
      store.setItem(REPLACE_SPACES_STORAGE_KEY, String(checked));
      state.run = null;
      localNamesCache = null;
    }

    // Same as setReplaceSpaces: picks a Shortcut's own name or its
    // target's for the Tree label and Local Name (see tree.js's
    // displayName), remembered across visits.
    function setUseShortcutTargetNames(checked) {
      if (isLocked()) return;
      state.useShortcutTargetNames = checked;
      store.setItem(USE_SHORTCUT_TARGET_NAMES_STORAGE_KEY, String(checked));
      state.run = null;
      localNamesCache = null;
    }

    // "Keep screen awake" is usable during a Run, unlike the other
    // options: toggling it takes hold or lets go of the Wake Lock at once.
    async function setKeepAwake(checked) {
      state.keepAwake = checked;
      store.setItem(KEEP_AWAKE_STORAGE_KEY, String(checked));
      if (checked) await acquireWakeLock();
      else await releaseWakeLock();
      notify();
    }

    // Re-reads just the Source sub-folder inside the Target Folder,
    // folding the result into state.target in place - Download's own
    // re-scan (see the spec's Target Folder scan triggers), catching
    // changes since the last full read without reading it all again. A
    // disk error here is left for the Run's own checks to surface.
    async function rescanSourceSubFolder() {
      const rootName = localNames().get(state.tree.id);
      // Same pairing mergeRows/existingLocalMatches use for the root
      // (exact case wins, else first in name order), not just any
      // case-insensitive name match - and only a folder, never a file
      // sitting in its place (that's a type clash, left for the Run's
      // own check to fail; nothing to rescan there).
      const rootMatch = matchSiblings(
        [state.tree],
        state.target.children,
        localNames(),
      ).matches.get(state.tree);
      const i =
        rootMatch && rootMatch.isFolder
          ? state.target.children.indexOf(rootMatch)
          : -1;
      let existing;
      try {
        existing = await findOnDisk(state.targetHandle, rootName);
      } catch {
        return;
      }
      if (!existing || existing.kind !== "directory") {
        if (i >= 0) state.target.children.splice(i, 1);
        return;
      }
      let rescanned;
      try {
        rescanned = await scanTargetFolder(existing);
      } catch {
        return;
      }
      if (i >= 0) state.target.children[i] = rescanned;
      else state.target.children.push(rescanned);
    }

    // How many of existingLocalMatches' matches the Run would actually
    // attempt to overwrite: real matches for files the user has selected
    // that aren't blocked outright (see run.js's own unfetchableReason) -
    // the count the confirm dialog shows and, on Continue, the Run
    // overwrites.
    function overwriteCount(matched) {
      let n = 0;
      for (const id of matched.keys()) {
        if (state.unselected.has(id)) continue;
        const node = findNode(state.tree, id);
        if (node && !unfetchableReason(node)) n += 1;
      }
      return n;
    }

    // Starts a Run: statuses reset to pending, folders left as the user
    // arranged them. knownExisting: ids with a real local match as of Download
    // being pressed (see run.js's own check). Resolves when the Run is
    // finished (settled normally, or ended by Stop).
    async function startRun(knownExisting) {
      state.run = createRun(state.tree, state.unselected);
      // Called (not awaited) before any await here, so pause()/resume()/
      // stop() are attached and state.run.status is "running" the moment
      // this function returns control to its caller — otherwise a Pause
      // requested in the gap while acquireWakeLock() is in flight would
      // find pause() not yet a function.
      const finished = runDownload(
        state.run,
        state.tree,
        localNames(),
        state.unselected,
        state.targetHandle,
        state.target,
        state.skipExisting,
        knownExisting,
        {
          fetch: ports.fetch,
          getToken: () => serverPort("getToken"),
          now: ports.now,
          chunkSize: ports.chunkSize,
          onChange: notify,
          setTimeout: ports.setTimeout,
          clearTimeout: ports.clearTimeout,
          isOnline: ports.isOnline,
          onOnline: ports.onOnline,
        },
      );
      notify();
      await acquireWakeLock();
      try {
        await finished;
      } finally {
        await releaseWakeLock();
        notify();
      }
    }

    // With "Skip existing files" on, starts the Run at once (unaffected
    // by any of this - the Run's own per-file check is all it ever
    // needs). Off, first re-reads the Source sub-folder and re-merges,
    // then either starts the Run or, with files to overwrite, stops at
    // the confirm dialog (confirmOverwrite/cancelOverwrite decide from
    // there) - so startRun's own synchronous prefix (attaching
    // pause()/resume()/stop() before its first await) still runs at once
    // for the common case, same as before ticket 10. Resolves once the
    // Run is finished, or at once when it stopped at the confirm dialog.
    async function download() {
      const stateNow = runState();
      if (stateNow !== "ready" && stateNow !== "finished") return;
      if (state.skipExisting) {
        await startRun(new Set());
        return;
      }
      // Locked for the rescan/re-merge itself (see isLocked), cleared
      // before starting the Run or showing the confirm dialog - neither
      // of which this flag should keep reporting "confirming" through.
      state.startingDownload = true;
      notify();
      let knownExisting;
      let n;
      try {
        await rescanSourceSubFolder();
        const matched = existingLocalMatches(
          state.tree,
          state.target,
          localNames(),
        );
        knownExisting = new Set(matched.keys());
        n = overwriteCount(matched);
      } finally {
        state.startingDownload = false;
      }
      if (n > 0) {
        state.pendingOverwriteCount = n;
        state.pendingKnownExisting = knownExisting;
        notify();
        return;
      }
      await startRun(knownExisting);
    }

    // Continues a Download held at the confirm dialog.
    async function confirmOverwrite() {
      if (state.pendingOverwriteCount === null) return;
      const knownExisting = state.pendingKnownExisting;
      state.pendingOverwriteCount = null;
      state.pendingKnownExisting = null;
      await startRun(knownExisting);
    }

    // Cancels a Download held at the confirm dialog, back to ready.
    function cancelOverwrite() {
      state.pendingOverwriteCount = null;
      state.pendingKnownExisting = null;
      notify();
    }

    async function pause() {
      if (!state.run || state.run.status !== "running") return;
      state.run.pause();
      await releaseWakeLock();
      notify();
    }

    async function resume() {
      if (
        !state.run ||
        (state.run.status !== "paused" && state.run.status !== "pausing")
      )
        return;
      await state.run.resume();
      await acquireWakeLock();
      notify();
    }

    function stop() {
      if (
        !state.run ||
        state.run.status === "stopping" ||
        state.run.status === "finished"
      )
        return;
      state.run.stop();
      notify();
    }

    function currentFileText() {
      const { current, items } = state.run;
      if (!current) return "";
      const item = items.get(current.id);
      if (item.phase === "checking") return `Checking ${current.path}…`;
      if (item.phase === "finalizing") return `Finalizing ${current.path}…`;
      if (item.phase === "waiting")
        return `Downloading ${current.path} · ${retryText(item)}`;
      // A Native File's size is never known until it's done (ticket 12):
      // bytes received only, no percentage - same as tree.js's fileProgress.
      if (current.size == null)
        return `Downloading ${current.path} · ${formatBytes(item.received)} · attempt ${item.attempt}`;
      return (
        `Downloading ${current.path} · ${formatProgress(item.received, current.size)}` +
        ` · ${percentOf(item.received, current.size)}% · attempt ${item.attempt}`
      );
    }

    function pausedText() {
      const { current, items, pauseMessage } = state.run;
      if (!current) return pauseMessage || "Paused";
      const item = items.get(current.id);
      const progress =
        current.size == null
          ? formatBytes(item.received)
          : formatProgress(item.received, current.size);
      const base = `Paused at ${current.path} · ${progress}`;
      return pauseMessage ? `${base} — ${pauseMessage}` : base;
    }

    function runSummary() {
      const counts = {};
      for (const item of state.run.items.values())
        counts[item.status] = (counts[item.status] || 0) + 1;
      const parts = SUMMARY_STATUSES.filter((s) => counts[s]).map(
        (s) => `${counts[s]} ${s}`,
      );
      return ["Run finished", ...parts].join(" · ");
    }

    function statusLine() {
      if (state.scanCount !== null)
        return `Reading Target Folder… ${state.scanCount} items`;
      if (!state.run) return "";
      const status = state.run.status;
      if (status === "pausing") return "Pausing…";
      if (status === "paused") return pausedText();
      if (status === "stopping") return "Finishing current file…";
      if (status === "running") return currentFileText();
      return runSummary(); // "finished"
    }

    function toggleLocalFolder(path) {
      if (state.expandedLocal.has(path)) state.expandedLocal.delete(path);
      else state.expandedLocal.add(path);
    }

    function toggleCollapsed(id) {
      if (state.collapsed.has(id)) state.collapsed.delete(id);
      else state.collapsed.add(id);
    }

    function expandAll() {
      state.collapsed = new Set();
      state.expandedLocal = allLocalFolderPaths(state.target);
    }

    function collapseAll() {
      state.collapsed = state.tree ? allFolderIds(state.tree) : new Set();
      state.expandedLocal = new Set();
    }

    function getViewModel() {
      const currentRunState = runState();
      const locked = isLocked();
      const items = state.run ? state.run.items : null;
      const previewExists = currentPreviewExists();
      const rows =
        state.tree || state.target
          ? mergeRows(state.tree, state.target, {
              collapsed: state.collapsed,
              expandedLocal: state.expandedLocal,
              items,
              localNames: localNames(),
              unselected: state.unselected,
              useShortcutTargetNames: state.useShortcutTargetNames,
              skipExisting: state.skipExisting,
              runFinished: !!state.run && state.run.status === "finished",
              previewExists,
            })
          : [];
      return {
        runState: currentRunState,
        url: state.url,
        urlError: state.urlError,
        reading: state.reading,
        urlDisabled: state.reading || locked,
        readDisabled: state.reading || !state.url || locked,
        locationDisabled: locked,
        optionsDisabled: locked,
        skipExisting: state.skipExisting,
        replaceSpaces: state.replaceSpaces,
        useShortcutTargetNames: state.useShortcutTargetNames,
        keepAwake: state.keepAwake,
        wakeLockHeld: !!wakeLockSentinel,
        hasLocation: !!state.targetHandle,
        locationText: state.targetHandle
          ? `📁 ${state.targetHandle.name}`
          : "No folder chosen",
        targetError: state.targetError,
        targetScanText:
          state.scanCount === null
            ? null
            : `Reading Target Folder… ${state.scanCount} items`,
        hasTarget: !!state.target,
        refreshVisible:
          !!state.targetHandle && state.scanCount === null && !locked,
        downloadDisabled:
          currentRunState !== "ready" && currentRunState !== "finished",
        confirmOverwriteCount: state.pendingOverwriteCount,
        pauseDisabled: currentRunState !== "running",
        resumeDisabled: currentRunState !== "paused",
        stopDisabled:
          currentRunState !== "running" && currentRunState !== "paused",
        selectionLocked: locked,
        pauseMessage: state.run ? state.run.pauseMessage || null : null,
        overall: state.tree
          ? overallProgress(state.tree, items, state.unselected, previewExists)
          : null,
        statusLine: statusLine(),
        rows,
        expandCollapseDisabled: rows.length === 0,
      };
    }

    return {
      getToken: () => serverPort("getToken"),
      setUrl,
      readDrive,
      setSkipExisting,
      setReplaceSpaces,
      setUseShortcutTargetNames,
      setKeepAwake,
      toggleSelected,
      download,
      confirmOverwrite,
      cancelOverwrite,
      pause,
      resume,
      stop,
      restoreLocation,
      chooseLocation,
      refreshTarget,
      toggleCollapsed,
      toggleLocalFolder,
      expandAll,
      collapseAll,
      getViewModel,
    };
  }
</script>
