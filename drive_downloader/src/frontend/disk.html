<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Drive Downloader</title>
    <?!= include('frontend/disk.css') ?>
  </head>
  <body>
    <header>
      <h1>Drive Downloader</h1>
      <a href="#" id="help">Help</a>
    </header>
    <p id="token-status">Fetching token&hellip;</p>

    <div class="url-row">
      <input
        type="text"
        id="source-url"
        placeholder="https://drive.google.com/drive/folders/..."
      />
      <button id="read-drive">Read Drive</button>
    </div>
    <p id="url-error" class="error" hidden></p>
    <p id="reading-status" hidden>Reading Drive&hellip;</p>

    <div class="location-row">
      <button id="choose-location">Location&hellip;</button>
      <span id="location-text"></span>
    </div>
    <p id="target-error" class="error" hidden></p>

    <div class="options-row">
      <label
        ><input type="checkbox" id="skip-existing" checked /> Skip existing
        files</label
      >
      <label
        ><input type="checkbox" id="replace-spaces" /> Replace spaces with
        _</label
      >
      <label
        ><input type="checkbox" id="keep-awake" checked /> Keep screen awake
        during download</label
      >
    </div>

    <div class="run-row">
      <button id="download" class="primary" disabled>Download</button>
      <button id="pause" disabled>Pause</button>
      <button id="resume" disabled>Resume</button>
      <button id="stop" disabled>Stop</button>
      <div id="overall" class="overall" hidden>
        <div class="bar"><i></i></div>
        <small></small>
      </div>
    </div>

    <div id="tree"></div>
    <p id="status-line"></p>

    <div id="confirm-overwrite" class="modal-back" hidden>
      <div class="modal">
        <b>Overwrite files?</b>
        <p id="confirm-overwrite-text"></p>
        <div class="btns">
          <button id="confirm-overwrite-cancel">Cancel</button>
          <button id="confirm-overwrite-continue" class="primary">
            Continue
          </button>
        </div>
      </div>
    </div>

    <?!= include('frontend/tree.js') ?>
    <?!= include('frontend/naming.js') ?>
    <?!= include('frontend/target-scan.js') ?>
    <?!= include('frontend/merge.js') ?>
    <?!= include('frontend/run.js') ?>
    <?!= include('frontend/controller.js') ?>
    <?!= include('frontend/disk-view.js') ?>
  </body>
</html>
