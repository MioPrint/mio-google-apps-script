<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Drive Downloader</title>
    <?!= include('frontend/disk.css') ?>
  </head>
  <body>
    <header>
      <h1>Drive Downloader</h1>
    </header>

    <div class="url-row">
      <input
        type="text"
        id="source-url"
        placeholder="https://drive.google.com/drive/folders/..."
      />
    </div>

    <div class="controls-row">
      <button id="read-drive">🔍 Read Drive</button>
      <button id="choose-location">📁 Local Target Folder</button>
      <button id="refresh-target" hidden>🔄 Refresh</button>
    </div>
    <p id="location-text"></p>

    <div class="panel-block">
      <div class="panel-left">
        <div class="options-list">
          <label
            ><input type="checkbox" id="skip-existing" checked /> Skip existing
            files</label
          >
          <label
            ><input type="checkbox" id="replace-spaces" /> Replace spaces with
            underscores</label
          >
          <label
            ><input type="checkbox" id="use-shortcut-target-names" /> Use
            Shortcut target names</label
          >
          <label
            ><input type="checkbox" id="keep-awake" checked /> Keep screen awake
            during download</label
          >
        </div>

        <div class="run-row">
          <button id="download" class="primary" disabled>⬇️ Download</button>
          <button id="pause" disabled>⏸️ Pause</button>
          <button id="resume" disabled>▶️ Resume</button>
          <button id="stop" disabled>⏹️ Stop</button>
        </div>
        <div class="run-row">
          <button id="expand-all" disabled>🔽 Expand all</button>
          <button id="collapse-all" disabled>🔼 Collapse all</button>
        </div>
      </div>
      <div class="status-panel">
        <div class="status-panel-inner">
          <div id="status-errors" class="error"></div>
          <div id="status-text"></div>
        </div>
      </div>
    </div>
    <div id="overall" class="overall" hidden>
      <div class="bar"><i></i></div>
      <small></small>
    </div>

    <div id="tree"></div>

    <div id="confirm-overwrite" class="modal-back" hidden>
      <div class="modal">
        <b>Overwrite files?</b>
        <p id="confirm-overwrite-text"></p>
        <div class="btns">
          <button id="confirm-overwrite-cancel">✖️ Cancel</button>
          <button id="confirm-overwrite-continue" class="primary">
            ✅ Continue
          </button>
        </div>
      </div>
    </div>

    <?!= include('frontend/tree.js') ?>
    <?!= include('frontend/naming.js') ?>
    <?!= include('frontend/target-scan.js') ?>
    <?!= include('frontend/merge.js') ?>
    <?!= include('frontend/run.js') ?>
    <?!= include('frontend/controller.js') ?>
    <?!= include('frontend/disk-view.js') ?>
  </body>
</html>
