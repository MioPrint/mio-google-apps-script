<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Drive Downloader</title>
    <?!= include('frontend/disk.css') ?>
  </head>
  <body>
    <header>
      <h1>Drive Downloader</h1>
      <span id="busy" class="busy" role="status" hidden></span>
    </header>

    <div class="url-row">
      <input
        type="text"
        id="source-url"
        placeholder="https://drive.google.com/drive/folders/..."
      />
    </div>

    <div class="controls-row">
      <span
        class="tip-target"
        data-tip="Read the Source Folder's contents from Google Drive."
        data-tip-delay="2000"
        ><button id="read-drive">🔍 Read Drive</button></span
      >
      <span
        class="tip-target"
        data-tip="Pick the local folder to mirror into."
        data-tip-delay="2000"
        ><button id="choose-location">📁 Local Target Folder</button></span
      >
      <span
        class="tip-target"
        data-tip="Read the Target Folder from disk again."
        data-tip-delay="2000"
        ><button id="refresh-target">🔄 Refresh</button></span
      >
    </div>

    <div class="panel-block">
      <div class="panel-left">
        <div class="options-list">
          <span
            class="tip-target"
            data-tip="Leave files already in the Target Folder alone. Off: overwrite them after a confirm."
            data-tip-delay="2000"
            ><input type="checkbox" id="skip-existing" checked /> Skip existing
            files</span
          >
          <span
            class="tip-target"
            data-tip="Use _ instead of spaces in Local Names."
            data-tip-delay="2000"
            ><input type="checkbox" id="replace-spaces" /> Replace spaces with
            underscores</span
          >
          <span
            class="tip-target"
            data-tip="Name a Shortcut's copy after what it points at, not the Shortcut."
            data-tip-delay="2000"
            ><input type="checkbox" id="use-shortcut-target-names" /> Use
            Shortcut target names</span
          >
          <span
            class="tip-target"
            data-tip="Stop the computer sleeping while the Run is running."
            data-tip-delay="2000"
            ><input type="checkbox" id="keep-awake" checked /> Keep screen awake
            during download</span
          >
        </div>

        <div class="run-row">
          <span
            class="tip-target"
            data-tip="Start mirroring the ticked files."
            data-tip-delay="2000"
            ><button id="download" class="primary" disabled>
              ⬇️ Download
            </button></span
          >
          <span
            class="tip-target"
            data-tip="Pause the Run; Resume continues from the same byte."
            data-tip-delay="2000"
            ><button id="pause" disabled>⏸️ Pause</button></span
          >
          <span
            class="tip-target"
            data-tip="Continue the paused Run."
            data-tip-delay="2000"
            ><button id="resume" disabled>▶️ Resume</button></span
          >
          <span
            class="tip-target"
            data-tip="End the Run; a half-written new file is removed."
            data-tip-delay="2000"
            ><button id="stop" disabled>⏹️ Stop</button></span
          >
        </div>
        <div class="run-row">
          <span
            class="tip-target"
            data-tip="Expand every folder in both trees."
            data-tip-delay="2000"
            ><button id="expand-all" disabled>🔽 Expand all</button></span
          >
          <span
            class="tip-target"
            data-tip="Collapse every folder in both trees."
            data-tip-delay="2000"
            ><button id="collapse-all" disabled>🔼 Collapse all</button></span
          >
        </div>
      </div>
      <div class="status-panel">
        <div class="status-panel-inner">
          <div id="status-errors" class="error"></div>
          <div id="status-text"></div>
        </div>
      </div>
    </div>
    <div id="overall" class="overall" hidden>
      <div class="bar"><i></i></div>
      <small></small>
    </div>

    <div id="tree"></div>

    <div id="tooltip" class="tooltip" role="tooltip"></div>

    <div id="confirm-overwrite" class="modal-back" hidden>
      <div class="modal">
        <b>Overwrite files?</b>
        <p id="confirm-overwrite-text"></p>
        <div class="btns">
          <button id="confirm-overwrite-cancel">✖️ Cancel</button>
          <button id="confirm-overwrite-continue" class="primary">
            ✅ Continue
          </button>
        </div>
      </div>
    </div>

    <?!= include('frontend/tree.js') ?>
    <?!= include('frontend/naming.js') ?>
    <?!= include('frontend/target-scan.js') ?>
    <?!= include('frontend/merge.js') ?>
    <?!= include('frontend/run.js') ?>
    <?!= include('frontend/controller.js') ?>
    <?!= include('frontend/tooltip.js') ?>
    <?!= include('frontend/disk-view.js') ?>
  </body>
</html>
