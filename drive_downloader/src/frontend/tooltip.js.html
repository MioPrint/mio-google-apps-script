<script>
  // Disk Window tooltips: one floating element shared by every target. A
  // target is any element with data-tip (the text) and data-tip-delay (ms);
  // the text shows after the delay, fades in, and hides at once on leave.
  // A target may also carry data-tip-key (its row and cell): the tree is
  // re-rendered while a file transfers, replacing the element under the
  // pointer, so the tip follows the key to the new element (ddTipSync,
  // called after each render) and keeps its timer and text.
  // Thin DOM wiring, not unit-tested (see docs/adr/0001-client-side-core.md).
  (function () {
    const tipEl = document.getElementById("tooltip");
    const MARGIN = 8;
    let current = null;
    let currentKey = null;
    let timer = null;
    let pointerX = 0;
    let pointerY = 0;

    function hide() {
      clearTimeout(timer);
      timer = null;
      current = null;
      currentKey = null;
      tipEl.classList.remove("show");
    }

    function place(target) {
      const rect = target.getBoundingClientRect();
      const tipRect = tipEl.getBoundingClientRect();
      const maxLeft = window.innerWidth - tipRect.width - MARGIN;
      const left = Math.max(MARGIN, Math.min(rect.left, maxLeft));
      const below = rect.bottom + 6;
      const fitsBelow = below + tipRect.height + MARGIN <= window.innerHeight;
      const top = fitsBelow
        ? below
        : Math.max(MARGIN, rect.top - 6 - tipRect.height);
      tipEl.style.left = `${left}px`;
      tipEl.style.top = `${top}px`;
    }

    function show(target) {
      tipEl.textContent = target.dataset.tip;
      place(target);
      tipEl.classList.add("show");
    }

    function isShown() {
      return tipEl.classList.contains("show");
    }

    // Re-binds the tip to the element now carrying its key, if the one it
    // was on has been replaced; hides it when that element is gone or no
    // longer under the pointer (a hit test at the last pointer position:
    // :hover is not updated until the next mouse event).
    window.ddTipSync = function () {
      if (!current || current.isConnected) return;
      const next = currentKey
        ? document.querySelector(`[data-tip-key="${CSS.escape(currentKey)}"]`)
        : null;
      if (
        !next ||
        !next.contains(document.elementFromPoint(pointerX, pointerY))
      ) {
        hide();
        return;
      }
      current = next;
      if (!isShown()) return;
      tipEl.textContent = next.dataset.tip;
      place(next);
    };

    document.addEventListener("mousemove", (e) => {
      pointerX = e.clientX;
      pointerY = e.clientY;
    });

    document.addEventListener("mouseover", (e) => {
      pointerX = e.clientX;
      pointerY = e.clientY;
      const target = e.target.closest?.("[data-tip]") ?? null;
      if (target === current) return;
      const key = target?.dataset.tipKey ?? null;
      if (key !== null && key === currentKey) {
        current = target;
        return;
      }
      hide();
      if (!target) return;
      current = target;
      currentKey = key;
      timer = setTimeout(
        () => show(target),
        Number(target.dataset.tipDelay) || 0,
      );
    });

    document.addEventListener("mouseout", (e) => {
      if (current && !current.contains(e.relatedTarget)) hide();
    });

    window.addEventListener("blur", hide);
    window.addEventListener("scroll", hide, true);
  })();
</script>
