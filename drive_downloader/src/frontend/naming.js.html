<script>
  // Naming: Drive name -> Local Name, the name an Item gets in the Target
  // Folder. No ports, no DOM (see docs/adr/0001-client-side-core.md).
  // Only the illegal-character rule so far; spaces -> "_" and numbering of
  // duplicate siblings come later.
  // Control characters are illegal in file names too, hence the lint
  // exception.
  // eslint-disable-next-line no-control-regex
  const ILLEGAL_NAME_CHARACTERS = /[<>:"/\\|?*\x00-\x1f]/g;

  function localName(driveName) {
    return driveName.replace(ILLEGAL_NAME_CHARACTERS, "+");
  }
</script>
