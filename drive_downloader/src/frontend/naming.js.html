<script>
  /* global displayName, NATIVE_FILE_EXPORTS */
  // Naming: Drive name -> Local Name, the name an Item gets in the Target
  // Folder. No ports, no DOM (see docs/adr/0001-client-side-core.md).
  //
  // Starting from a node's display name (its own name, or a Shortcut's
  // target name when that option is on - see tree.js's displayName):
  // leading and trailing spaces dropped (a spaces-only name becomes "+"),
  // illegal characters -> "+", spaces -> "_" when the option is on, the
  // Office extension appended for a Native File unless already present
  // (ticket 12), then duplicate Local Names among siblings (ignoring
  // case, files and folders together) numbered in sibling order: the
  // first stays plain, every duplicate gets "(1)", "(2)"... skipping a
  // number a real sibling already has. The number goes before the last
  // extension for files, at the end for folders.
  // Control characters are illegal in file names too, hence the lint
  // exception.
  // eslint-disable-next-line no-control-regex
  const ILLEGAL_NAME_CHARACTERS = /[<>:"/\\|?*\x00-\x1f]/g;

  // A node's Local Name before numbering: the two ends of the whole name
  // trimmed of spaces (a spaces-only name becomes "+"), illegal
  // characters replaced, spaces too when replaceSpaces is on, the Office
  // extension appended for a Native File (mimeType is the resolved -
  // target, for a Shortcut - type; see tree.js's nodeFromItem) unless the
  // name already ends with it, case-insensitively.
  function baseLocalName(driveName, replaceSpaces, mimeType) {
    const trimmed = driveName.replace(/^ +| +$/g, "") || "+";
    const cleaned = trimmed.replace(ILLEGAL_NAME_CHARACTERS, "+");
    const named = replaceSpaces ? cleaned.replace(/ /g, "_") : cleaned;
    const native = NATIVE_FILE_EXPORTS[mimeType];
    if (!native || named.toLowerCase().endsWith(native.extension)) return named;
    return named + native.extension;
  }

  // A file name's base and extension (with its leading dot), the last
  // extension only. A dotfile (".bashrc") or a name with no dot keeps it
  // all as base, with no extension.
  function splitExtension(name) {
    const i = name.lastIndexOf(".");
    return i > 0
      ? { base: name.slice(0, i), ext: name.slice(i) }
      : { base: name, ext: "" };
  }

  // name with " (n)" inserted before the last extension; folders get it
  // at the end.
  function withNumber(name, n, isFolder) {
    if (isFolder) return `${name} (${n})`;
    const { base, ext } = splitExtension(name);
    return `${base} (${n})${ext}`;
  }

  // Local Names for one folder's Drive children, already in sibling
  // order: a Map from child to its Local Name. Grouped by the base
  // Local Name ignoring case; within a group the first child in sibling
  // order stays plain, every later one is numbered from (1), skipping
  // any number a real sibling's own base Local Name already holds.
  function siblingLocalNames(children, replaceSpaces, useShortcutTargetNames) {
    const groups = new Map();
    for (const child of children) {
      const base = baseLocalName(
        displayName(child, useShortcutTargetNames),
        replaceSpaces,
        child.mimeType,
      );
      const key = base.toLowerCase();
      if (!groups.has(key)) groups.set(key, []);
      // A loop Shortcut is a childless leaf (see tree.js's nodeFromItem),
      // but its target is always a folder (only a folder can be an
      // ancestor to loop back into) - numbered like one, not split at a
      // stray dot in the folder's own name.
      const isFolder = !!child.children || !!child.loop;
      groups.get(key).push({ child, base, isFolder });
    }
    const taken = new Set(groups.keys());
    const names = new Map();
    for (const [first, ...rest] of groups.values()) {
      names.set(first.child, first.base);
      let n = 1;
      for (const dup of rest) {
        let candidate = withNumber(dup.base, n, dup.isFolder);
        while (taken.has(candidate.toLowerCase())) {
          n += 1;
          candidate = withNumber(dup.base, n, dup.isFolder);
        }
        taken.add(candidate.toLowerCase());
        names.set(dup.child, candidate);
        n += 1;
      }
    }
    return names;
  }

  // Every node's Local Name in a Tree, id -> string. Each folder's
  // children are numbered only among themselves; the root has no
  // siblings, so it just gets its base Local Name. useShortcutTargetNames
  // picks a Shortcut's own name or its target's (see tree.js's
  // displayName); the root is never a Shortcut.
  function computeLocalNames(root, replaceSpaces, useShortcutTargetNames) {
    const names = new Map();
    names.set(root.id, baseLocalName(root.name, replaceSpaces));
    (function walk(node) {
      if (!node.children) return;
      for (const [child, name] of siblingLocalNames(
        node.children,
        replaceSpaces,
        useShortcutTargetNames,
      )) {
        names.set(child.id, name);
        walk(child);
      }
    })(root);
    return names;
  }
</script>
