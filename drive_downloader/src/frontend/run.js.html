<script>
  /* global compareNames, formatBytes, errorText, SHORTCUT_UNREACHABLE_REASON, BLOCKED_BY_OWNER_REASON, NATIVE_FILE_EXPORTS */
  // Run engine: mirrors the Tree into the Target Folder one file at a time,
  // in Tree order, streaming each normal file from the Drive API in byte
  // ranges into a writable. Reaches the outside world only through the
  // io ports it is handed (see docs/adr/0001-client-side-core.md).
  //
  // A Run is { items, current, token, tokenAt, status }: items maps each
  // file Item's id to { status, received, phase, attempt, reason,
  // overwrite }, status one of pending / downloading / done / exists /
  // failed, phase (while downloading) checking / transferring /
  // finalizing / waiting (waiting to retry), attempt the Item's current
  // Attempt number (1-5, see CONTEXT.md), overwrite whether the per-file
  // check found a real existing file there - set before transfer() ever
  // runs, since transfer()'s own writes update the local tree in place,
  // leaving nothing else to tell "overwritten" apart from "saved" once
  // done (see merge.js's own Result for done/failed). current is { id,
  // path, size } of the file in hand, path
  // its Local Name path under the Target Folder; status is the Run's own
  // state (see below), pauseMessage the reason a disk error paused it, if
  // any. runDownload attaches pause()/resume()/stop() commands onto the
  // Run object.
  //
  // Run status: running -> pausing (Pause pressed, or a disk error) ->
  // paused -> running (Resume), or -> stopping (Stop pressed) -> finished.
  // "pausing" only lasts until the nearest checkpoint notices it, since
  // most disk/network operations can't be interrupted mid-call.
  const DRIVE_FILES_URL = "https://www.googleapis.com/drive/v3/files";
  const DRIVE_OPERATIONS_URL = "https://www.googleapis.com/drive/v3/operations";
  const DEFAULT_CHUNK_SIZE = 128 * 1024 * 1024;
  const TOKEN_MAX_AGE_MS = 10 * 60 * 1000;
  const FOLDER_NOT_CREATED = "folder could not be created";
  const EXPORT_SIZE_LIMIT_REASON = "exportSizeLimitExceeded";
  const LRO_POLL_INTERVAL_MS = 5000;
  const LRO_POLL_TIMEOUT_MS = 10 * 60 * 1000;

  // Drive 403 reasons that never pass, however many times they're asked.
  const PERMANENT_403_REASONS = new Set([
    "fileNotDownloadable",
    "cannotDownloadAbusiveFile",
  ]);

  // An Attempt gets a fresh delay for Attempts 2-5 (CONTEXT.md's "one try,
  // three that resume, a final one from the start"); Attempt 1 never
  // waits. Retry-After overrides this when Drive sends one.
  const BACKOFF_MS = { 2: 2000, 3: 10000, 4: 30000, 5: 60000 };
  const MAX_ATTEMPTS = 5;
  const MAX_RETRY_AFTER_MS = 5 * 60 * 1000;

  // Thrown to unwind the whole Tree walk once Stop has been handled at the
  // point it was noticed; never a real failure.
  class StopSignal {}

  // The message a disk error pauses the Run with, or null when error isn't
  // one: not enough space, lost permission, or the Target Folder itself
  // gone.
  function diskErrorMessage(error) {
    const name = error && error.name;
    if (name === "QuotaExceededError")
      return "Not enough free disk space. Free up space, then press Resume.";
    if (name === "NotFoundError")
      return "The Target Folder was moved or deleted. Choose it again, then press Resume.";
    if (name === "NotAllowedError" || name === "SecurityError")
      return "Lost permission to the Target Folder. Press Resume to allow it again.";
    return null;
  }

  // Tags an Error as transient (retried through the Attempts machinery) or
  // permanent (fails the file at once). Everything thrown on the byte
  // path is tagged one way or the other; nothing is left to guess.
  function tagError(error, transient) {
    return Object.assign(error, { transient });
  }

  function createRun(tree, unselected) {
    const items = new Map();
    (function walk(node) {
      for (const child of node.children) {
        if (child.children) walk(child);
        else
          items.set(
            child.id,
            unselected && unselected.has(child.id)
              ? { status: "unselected", received: 0 }
              : { status: "pending", received: 0 },
          );
      }
    })(tree);
    return { items, current: null, token: null, tokenAt: 0, status: null };
  }

  // Why the Run won't fetch a file, or null when it will. loop/unsupported
  // (see tree.js's staticLeafStatus for the same checks pre-Run) are
  // checked first so wantsFolder treats them as nothing to write, same as
  // any other unfetchable file; runFile itself special-cases loop and
  // unsupported to settle them with their own status rather than "failed".
  function unfetchableReason(node) {
    if (node.loop) return "a Shortcut back into its own ancestry";
    if (node.unreachable) return SHORTCUT_UNREACHABLE_REASON;
    if (node.unsupported) return "this file type can't be mirrored";
    if (node.canDownload === false) return BLOCKED_BY_OWNER_REASON;
    return null;
  }

  // A folder is created only if it is empty in Drive or holds, somewhere
  // below, a ticked file the Run will fetch. An empty folder is created
  // regardless of ticking: there is nothing under it to untick.
  function wantsFolder(node, unselected) {
    return (
      node.children.length === 0 ||
      node.children.some((child) =>
        child.children
          ? wantsFolder(child, unselected)
          : !unselected.has(child.id) && !unfetchableReason(child),
      )
    );
  }

  // The entry on disk a Local Name maps to, ignoring case: the exact-case
  // one if present, else the first in name order (as the merge pairs them).
  async function findOnDisk(dirHandle, name) {
    const lower = name.toLowerCase();
    const found = [];
    for await (const entry of dirHandle.values()) {
      if (entry.name.toLowerCase() === lower) found.push(entry);
    }
    return (
      found.find((entry) => entry.name === name) ||
      found.sort((a, b) => compareNames(a.name, b.name))[0] ||
      null
    );
  }

  // Keeps the scanned local tree in step with what the Run finds and
  // writes, so the Target Folder rows update without a re-read.
  function putLocalFolder(localFolder, name) {
    const existing = localFolder.children.find(
      (c) => c.name === name && c.isFolder,
    );
    if (existing) return existing;
    const created = { name, isFolder: true, children: [] };
    localFolder.children.push(created);
    return created;
  }

  function putLocalFile(localFolder, entry) {
    const i = localFolder.children.findIndex((c) => c.name === entry.name);
    const local = { ...entry, isFolder: false };
    if (i >= 0) localFolder.children[i] = local;
    else localFolder.children.push(local);
  }

  function joinPath(parentPath, name) {
    return parentPath ? `${parentPath}/${name}` : name;
  }

  // The next Attempt to run after a transient failure, or null once
  // Attempts are exhausted. progressed says the failing Attempt wrote new
  // bytes before it failed, which gives the file its full count back
  // (CONTEXT.md); an Attempt that reaches 5 always restarts from 0.
  function nextAttemptPlan(currentAttempt, progressed, error) {
    const attempt = progressed ? 1 : currentAttempt + 1;
    if (attempt > MAX_ATTEMPTS) return null;
    const waitMs =
      error.retryAfterMs != null
        ? Math.min(error.retryAfterMs, MAX_RETRY_AFTER_MS)
        : BACKOFF_MS[attempt] || 0;
    return { attempt, waitMs, restart: attempt === MAX_ATTEMPTS };
  }

  // Drive's Retry-After, honoured on 429/503 only, in ms; null when absent
  // or unparsable (Drive sends delta-seconds, not an HTTP date).
  function retryAfterMs(res) {
    if (res.status !== 429 && res.status !== 503) return null;
    const header =
      res.headers && res.headers.get ? res.headers.get("Retry-After") : null;
    const seconds = header == null ? NaN : Number(header);
    return Number.isNaN(seconds) ? null : seconds * 1000;
  }

  // Turns a non-ok Drive response into a tagged Error: permanent for a
  // fileNotDownloadable/abuse-flagged 403 or a 404, transient otherwise
  // (5xx, 429, and anything unrecognised - see ticket 09). driveReason is
  // carried on the error too, for a caller that needs the raw Drive
  // reason itself (exportNativeFile's exportSizeLimitExceeded check).
  async function driveError(res) {
    let reason = "";
    try {
      const body = await res.json();
      const first = body.error.errors && body.error.errors[0];
      reason = (first && first.reason) || body.error.message || "";
    } catch {
      // Not a Drive JSON error; the status alone will do.
    }
    const permanent =
      res.status === 404 ||
      (res.status === 403 && PERMANENT_403_REASONS.has(reason));
    // "flagged as abusive" reads better than the raw Drive reason
    // (ticket 12's abuse-flag story); every other reason keeps it.
    const message =
      reason === "cannotDownloadAbusiveFile"
        ? "flagged as abusive"
        : `Drive answered HTTP ${res.status}${reason ? ` (${reason})` : ""}`;
    return Object.assign(tagError(new Error(message), !permanent), {
      retryAfterMs: retryAfterMs(res),
      driveReason: reason,
    });
  }

  // localNames: id -> Local Name (see naming.js). unselected: ids of files
  // the user has unticked (see tree.js); already reflected in run.items'
  // starting statuses, but wantsFolder needs it directly too. skipExisting:
  // the "Skip existing files" checkbox; false overwrites instead.
  // knownExisting: ids with a real local match as of Download being
  // pressed (see merge.js's existingLocalMatches) - overwritten only when
  // skipExisting is off and the id is in it; anything else found on disk
  // at the per-file check is left as "exists" (skipped), never
  // overwritten, since it wasn't in the count the user confirmed. io: {
  // fetch(url, init) (the Drive port), getToken() -> token (the Server
  // port), now() -> epoch ms, chunkSize, setTimeout(fn, ms) -> id,
  // clearTimeout(id), isOnline() -> bool, onOnline(fn) -> unsubscribe
  // (the retry-wait ports), onChange() }.
  async function runDownload(
    run,
    tree,
    localNames,
    unselected,
    targetHandle,
    target,
    skipExisting,
    knownExisting,
    io,
  ) {
    const chunkSize = io.chunkSize || DEFAULT_CHUNK_SIZE;
    const notify = () => io.onChange && io.onChange();

    run.status = "running";
    run.pauseMessage = null;
    run.diskPause = false;
    let wake = null; // resolves the current pause/disk-error wait, if any
    let activeAbort = null; // the in-flight Drive fetch's AbortController
    let cancelRetryWait = null; // cuts a retry-backoff/offline wait short

    function wait() {
      return new Promise((resolve) => {
        wake = resolve;
      });
    }

    // Called between units of work (before each Item, before each chunk):
    // ends the Run at once if Stop was requested, or blocks here until
    // Resume if Pause was.
    async function checkpoint() {
      if (run.status === "stopping") throw new StopSignal();
      if (run.status !== "pausing") return;
      run.status = "paused";
      notify();
      await wait();
      if (run.status === "stopping") throw new StopSignal();
    }

    // Retries a disk operation, pausing the Run on a disk error (full
    // disk, lost permission, Target Folder moved or deleted) until
    // Resume, which re-requests permission first; any other error (or a
    // Stop while paused) passes straight through.
    async function diskOp(fn) {
      for (;;) {
        try {
          return await fn();
        } catch (error) {
          if (error instanceof StopSignal) throw error;
          const message = diskErrorMessage(error);
          if (!message) throw error;
          run.status = "paused";
          run.pauseMessage = message;
          run.diskPause = true;
          notify();
          await wait();
          if (run.status === "stopping") throw new StopSignal();
        }
      }
    }

    // Waits ms (a backoff, capped Retry-After) or, when ms is null, for
    // the network to come back - cancellable by Pause or Stop, which call
    // cancelRetryWait to resolve it early (see run.pause/run.stop).
    function waitToRetry(ms) {
      return new Promise((resolve) => {
        let timerId = null;
        let unsubscribe = null;
        const finish = () => {
          cancelRetryWait = null;
          if (timerId !== null) io.clearTimeout(timerId);
          if (unsubscribe) unsubscribe();
          resolve();
        };
        cancelRetryWait = finish;
        if (ms == null) unsubscribe = io.onOnline(finish);
        else timerId = io.setTimeout(finish, ms);
      });
    }

    run.pause = () => {
      if (run.status !== "running") return;
      run.status = "pausing";
      if (activeAbort) activeAbort.abort();
      if (cancelRetryWait) cancelRetryWait();
      notify();
    };

    // Chrome only allows requestPermission from a user gesture, so a
    // disk-error pause re-requests it here, on the Resume click itself.
    run.resume = async () => {
      if (run.status !== "paused" && run.status !== "pausing") return;
      if (run.diskPause) {
        try {
          await targetHandle.requestPermission({ mode: "readwrite" });
        } catch {
          // The retried disk operation will fail the same way and pause
          // again if permission is still refused.
        }
      }
      run.diskPause = false;
      run.pauseMessage = null;
      const w = wake;
      wake = null;
      run.status = "running";
      notify();
      if (w) w();
    };

    run.stop = () => {
      if (run.status === "stopping" || run.status === "finished") return;
      run.status = "stopping";
      run.pauseMessage = null;
      if (activeAbort) activeAbort.abort();
      if (cancelRetryWait) cancelRetryWait();
      notify();
      const w = wake;
      wake = null;
      if (w) w();
    };

    function settle(node, status, reason) {
      const item = run.items.get(node.id);
      item.status = status;
      item.phase = null;
      if (reason) item.reason = reason;
      run.current = null;
      notify();
    }

    // Aborts the writable and, for a file the Run itself created, removes
    // the partial entry it leaves behind; an overwritten file's original
    // bytes are untouched (the writable never held them).
    async function cleanupWritable(writable, folder, onDiskName, created) {
      try {
        await writable.abort();
      } catch {
        // Already closed or broken; nothing left to discard.
      }
      if (created) {
        try {
          await folder.dir.removeEntry(onDiskName);
        } catch {
          // Leaves an empty file, which a later Run treats as missing.
        }
      }
    }

    async function refreshToken() {
      try {
        run.token = await io.getToken();
      } catch (error) {
        run.token = null;
        throw tagError(
          new Error(`couldn't get a Drive token: ${errorText(error)}`, {
            cause: error,
          }),
          true,
        );
      }
      run.tokenAt = io.now();
    }

    async function send(node, range, signal) {
      // A Shortcut's node.id is its own (its Run/selection identity, kept
      // distinct per place it appears - see tree.js's nodeFromItem);
      // driveId, when set, is the target's real id, which is what Drive
      // actually serves bytes for.
      const driveId = node.driveId || node.id;
      const headers = { Authorization: `Bearer ${run.token}`, Range: range };
      if (node.resourceKey)
        headers["X-Goog-Drive-Resource-Keys"] =
          `${driveId}/${node.resourceKey}`;
      try {
        return await io.fetch(
          `${DRIVE_FILES_URL}/${encodeURIComponent(driveId)}?alt=media&supportsAllDrives=true`,
          { headers, signal },
        );
      } catch (error) {
        if (error && error.name === "AbortError") throw error;
        throw tagError(
          new Error(`network error: ${errorText(error)}`, { cause: error }),
          true,
        );
      }
    }

    // One ranged request, token kept fresh: refreshed first when older
    // than 10 minutes, and on a 401 the same range is asked again once
    // (no Attempt used either way - see ticket 05). A 401 surviving that
    // refresh is a transient failure like any other.
    async function fetchRange(node, range) {
      if (!run.token || io.now() - run.tokenAt > TOKEN_MAX_AGE_MS)
        await refreshToken();
      const controller = new AbortController();
      activeAbort = controller;
      let res = await send(node, range, controller.signal);
      if (res.status === 401) {
        await refreshToken();
        res = await send(node, range, controller.signal);
      }
      if (!res.ok) throw await driveError(res);
      return res;
    }

    async function transferChunk(node, item, writable) {
      const start = item.received;
      const end = Math.min(start + chunkSize, node.size) - 1;
      try {
        const res = await fetchRange(node, `bytes=${start}-${end}`);
        if (res.status !== 206 && start > 0)
          throw tagError(new Error("Drive ignored the byte range"), true);
        const reader = res.body.getReader();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          await writable.write(value);
          item.received += value.byteLength;
          notify();
        }
        if (item.received <= end)
          throw tagError(
            new Error("Drive sent fewer bytes than asked for"),
            true,
          );
      } finally {
        activeAbort = null;
      }
    }

    // Stop's cleanup: aborts the writable (and removes it, if the Run made
    // it), then puts the file back to pending, same as one never reached.
    async function abandon(item, writable, folder, onDiskName, created) {
      await cleanupWritable(writable, folder, onDiskName, created);
      item.status = "pending";
      item.phase = null;
      item.received = 0;
      run.current = null;
      notify();
    }

    // Handles one Attempt's transient failure: waits for the network when
    // offline (no Attempt spent), else works out and waits for the next
    // Attempt. The size-mismatch case (ticket 09) forces "no progress" by
    // passing item.received itself as attemptStartReceived (progress
    // there can never be resumed from) - it always spends an Attempt and
    // the caller always restarts regardless of plan.restart, since its
    // writable is already closed either way. Returns { giveUp: true }
    // once Attempts are exhausted, else { giveUp: false, restart }; a
    // Stop noticed while waiting throws StopSignal, left for the caller
    // to clean up.
    async function handleFailure(item, error, attemptStartReceived) {
      if (!io.isOnline()) {
        item.phase = "waiting";
        item.waitKind = "offline";
        item.waitMs = null;
        notify();
        await waitToRetry(null);
        await checkpoint();
        return { giveUp: false, restart: false };
      }
      const progressed = item.received > attemptStartReceived;
      const plan = nextAttemptPlan(item.attempt, progressed, error);
      if (!plan) return { giveUp: true };
      item.attempt = plan.attempt;
      item.waitKind = "backoff";
      item.waitMs = plan.waitMs;
      if (plan.waitMs > 0) {
        item.phase = "waiting";
        notify();
        await waitToRetry(plan.waitMs);
      }
      await checkpoint();
      return { giveUp: false, restart: plan.restart };
    }

    // Writes one file under onDiskName; created says the Run made the file,
    // so a failure removes it rather than leaving an empty one behind.
    async function transfer(node, item, folder, onDiskName, created) {
      let handle;
      let writable;
      try {
        handle = await diskOp(() =>
          folder.dir.getFileHandle(onDiskName, { create: true }),
        );
        writable = await diskOp(() => handle.createWritable());
      } catch (error) {
        if (error instanceof StopSignal) throw error;
        return settle(node, "failed", `couldn't write: ${errorText(error)}`);
      }
      item.attempt = 1;
      item.phase = "transferring";
      notify();
      let attemptStartReceived = item.received;

      // Runs handleFailure and applies its outcome up to (not including)
      // the restart step, which differs by caller: truncating the still-
      // open writable mid-transfer vs. recreating an already-closed one
      // after a size mismatch (see the two call sites below). On giveUp,
      // cleans up and settles the file failed, returning null so the
      // caller stops; a StopSignal noticed while waiting abandons the
      // file (removing it if the Run created it) before rethrowing.
      async function retryOrFail(error, attemptStartReceivedNow) {
        let outcome;
        try {
          outcome = await handleFailure(item, error, attemptStartReceivedNow);
        } catch (stopError) {
          await abandon(item, writable, folder, onDiskName, created);
          throw stopError;
        }
        if (outcome.giveUp) {
          await cleanupWritable(writable, folder, onDiskName, created);
          settle(node, "failed", errorText(error));
          return null;
        }
        return outcome;
      }

      for (;;) {
        try {
          while (item.received < node.size) {
            await checkpoint();
            await diskOp(() => transferChunk(node, item, writable));
          }
        } catch (error) {
          const stopping =
            error instanceof StopSignal ||
            (error && error.name === "AbortError" && run.status === "stopping");
          if (stopping) {
            await abandon(item, writable, folder, onDiskName, created);
            throw new StopSignal();
          }
          if (error && error.name === "AbortError") {
            // Our own Pause interrupted the fetch; keep the writable and
            // resume from the same byte once the user presses Resume.
            run.status = "paused";
            notify();
            await wait();
            if (run.status === "stopping") {
              await abandon(item, writable, folder, onDiskName, created);
              throw new StopSignal();
            }
            continue;
          }
          if (error.transient === false) {
            await cleanupWritable(writable, folder, onDiskName, created);
            return settle(node, "failed", errorText(error));
          }
          const outcome = await retryOrFail(error, attemptStartReceived);
          if (!outcome) return;
          if (outcome.restart) {
            try {
              await diskOp(() => writable.truncate(0));
            } catch (stopError) {
              await abandon(item, writable, folder, onDiskName, created);
              throw stopError;
            }
            item.received = 0;
          }
          attemptStartReceived = item.received;
          item.phase = "transferring";
          notify();
          continue;
        }

        item.phase = "finalizing";
        notify();
        try {
          await diskOp(() => writable.close());
        } catch (error) {
          if (error instanceof StopSignal) {
            await abandon(item, writable, folder, onDiskName, created);
            throw error;
          }
          await cleanupWritable(writable, folder, onDiskName, created);
          return settle(node, "failed", errorText(error));
        }
        let file;
        try {
          file = await handle.getFile();
        } catch (error) {
          return settle(node, "failed", `couldn't check: ${errorText(error)}`);
        }
        putLocalFile(folder.local, {
          name: onDiskName,
          size: file.size,
          modified: file.lastModified,
        });
        if (file.size === node.size) return settle(node, "done");

        const mismatch = tagError(
          new Error(
            `size on disk (${formatBytes(file.size)}) doesn't match Drive (${formatBytes(node.size)})`,
          ),
          true,
        );
        // item.received itself as attemptStartReceivedNow forces "no
        // progress" (the whole file was received, but none of it can be
        // resumed from), so this always spends an Attempt; the writable
        // is already closed, so a restart always follows regardless of
        // outcome.restart.
        const outcome = await retryOrFail(mismatch, item.received);
        if (!outcome) return;
        try {
          writable = await diskOp(() => handle.createWritable());
        } catch (error) {
          if (error instanceof StopSignal) {
            await abandon(item, writable, folder, onDiskName, created);
            throw error;
          }
          return settle(node, "failed", `couldn't write: ${errorText(error)}`);
        }
        item.received = 0;
        attemptStartReceived = 0;
        item.phase = "transferring";
        notify();
      }
    }

    // A ranged-fetch-free request for the Native File byte path (export,
    // the files.download LRO and its downloadUri): a fresh
    // AbortController every call, so Pause always aborts the request
    // actually in flight and never a stale, already-aborted one left
    // over from an earlier pause/resume earlier in the same Attempt -
    // reusing one controller across a whole Attempt let a Pause during
    // pollLroOperation's wait (nothing in flight to abort there) leave
    // the NEXT poll's fetch born pre-aborted, pausing the Run a second
    // time for no reason the moment Resume was pressed. The caller
    // clears activeAbort once truly done with the response: right away
    // for a short call, after streaming its body for one that streams
    // (see getLroOperation/downloadViaLro/exportNativeFile).
    async function driveFetch(url, init) {
      activeAbort = new AbortController();
      try {
        return await io.fetch(url, { ...init, signal: activeAbort.signal });
      } catch (error) {
        if (error && error.name === "AbortError") throw error;
        throw tagError(
          new Error(`network error: ${errorText(error)}`, { cause: error }),
          true,
        );
      }
    }

    // Retries a 401 once with a refreshed token, no Attempt spent (same
    // contract as fetchRange's own ranged fetch - ticket 05). buildInit
    // is called again on retry so its headers carry the fresh token.
    async function driveFetchWithReauth(url, buildInit) {
      let res = await driveFetch(url, buildInit());
      if (res.status === 401) {
        await refreshToken();
        res = await driveFetch(url, buildInit());
      }
      return res;
    }

    function nativeAuthHeaders(node, driveId) {
      const headers = { Authorization: `Bearer ${run.token}` };
      if (node.resourceKey)
        headers["X-Goog-Drive-Resource-Keys"] =
          `${driveId}/${node.resourceKey}`;
      return headers;
    }

    // Streams a response body into the writable, counting item.received as
    // bytes arrive - the Native File equivalent of transferChunk, but for
    // the whole file at once (no ranges - see exportNativeFile).
    async function streamInto(res, item, writable) {
      const reader = res.body.getReader();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        await writable.write(value);
        item.received += value.byteLength;
        notify();
      }
    }

    async function getLroOperation(node, driveId, name) {
      try {
        const res = await driveFetchWithReauth(
          `${DRIVE_OPERATIONS_URL}/${encodeURIComponent(name)}`,
          () => ({ headers: nativeAuthHeaders(node, driveId) }),
        );
        if (!res.ok) throw await driveError(res);
        return await res.json();
      } finally {
        activeAbort = null;
      }
    }

    // Polls a files.download LRO until it's done, honouring Pause (via
    // the same waitToRetry/checkpoint pairing handleFailure uses for a
    // retry wait) and Stop; gives up past LRO_POLL_TIMEOUT_MS.
    async function pollLroOperation(node, driveId, op) {
      const deadline = io.now() + LRO_POLL_TIMEOUT_MS;
      let operation = op;
      while (!operation.done) {
        if (io.now() >= deadline)
          throw tagError(new Error("Drive's export took too long"), true);
        await waitToRetry(LRO_POLL_INTERVAL_MS);
        await checkpoint();
        operation = await getLroOperation(node, driveId, operation.name);
      }
      return operation;
    }

    // The files.download LRO fallback for a Native File over Drive's
    // export size cap: starts the LRO, polls it to completion, then
    // streams its downloadUri (ticket 12). A 403 exportSizeLimitExceeded
    // starting the LRO itself is permanent - Drive's own large-file path
    // can't export it either, so retrying won't help.
    async function downloadViaLro(
      node,
      item,
      writable,
      driveId,
      exportMimeType,
    ) {
      let started;
      try {
        const startRes = await driveFetchWithReauth(
          `${DRIVE_FILES_URL}/${encodeURIComponent(driveId)}/download?mimeType=${encodeURIComponent(exportMimeType)}&supportsAllDrives=true`,
          () => ({ method: "POST", headers: nativeAuthHeaders(node, driveId) }),
        );
        if (!startRes.ok) {
          const error = await driveError(startRes);
          if (error.driveReason === EXPORT_SIZE_LIMIT_REASON)
            error.transient = false;
          throw error;
        }
        started = await startRes.json();
      } finally {
        activeAbort = null;
      }
      const op = started.done
        ? started
        : await pollLroOperation(node, driveId, started);
      const uri = op.response && op.response.downloadUri;
      if (!uri)
        throw tagError(
          new Error("Drive's export didn't return a download link"),
          true,
        );
      if (!run.token || io.now() - run.tokenAt > TOKEN_MAX_AGE_MS)
        await refreshToken();
      try {
        const res = await driveFetchWithReauth(uri, () => ({
          headers: nativeAuthHeaders(node, driveId),
        }));
        if (!res.ok) throw await driveError(res);
        await streamInto(res, item, writable);
      } finally {
        activeAbort = null;
      }
    }

    // One Native File Attempt: files.export to the Office MIME type,
    // falling back to the files.download LRO on a 403
    // exportSizeLimitExceeded (Drive's export size cap - ticket 12).
    //
    // Always discards whatever the writable already holds first: this is
    // the one place every retry of a Native File funnels through -
    // transferNative's own retry/Pause loop, but also diskOp's internal
    // retry after a disk error mid-write, which never returns control to
    // that loop - so it is the only safe place to guarantee "every
    // Attempt starts from 0" (CONTEXT.md's Native File) actually holds.
    async function exportNativeFile(node, item, writable) {
      if (!run.token || io.now() - run.tokenAt > TOKEN_MAX_AGE_MS)
        await refreshToken();
      if (item.received > 0) {
        await writable.truncate(0);
        item.received = 0;
      }
      const driveId = node.driveId || node.id;
      const exportMimeType = NATIVE_FILE_EXPORTS[node.mimeType].exportMimeType;
      const url = `${DRIVE_FILES_URL}/${encodeURIComponent(driveId)}/export?mimeType=${encodeURIComponent(exportMimeType)}&supportsAllDrives=true`;
      let res;
      try {
        res = await driveFetchWithReauth(url, () => ({
          headers: nativeAuthHeaders(node, driveId),
        }));
        if (res.ok) {
          await streamInto(res, item, writable);
          return;
        }
      } finally {
        activeAbort = null;
      }
      const error = await driveError(res);
      if (error.driveReason !== EXPORT_SIZE_LIMIT_REASON) throw error;
      await downloadViaLro(node, item, writable, driveId, exportMimeType);
    }

    // Writes a Native File under onDiskName: no size, no resume (Drive
    // never reports one and there is no Range to resume from), so every
    // Attempt - and every Pause - discards whatever was written and
    // starts the whole export again from byte 0; there is no completion
    // size check either (ticket 12's Native File).
    async function transferNative(node, item, folder, onDiskName, created) {
      let handle;
      let writable;
      try {
        handle = await diskOp(() =>
          folder.dir.getFileHandle(onDiskName, { create: true }),
        );
        writable = await diskOp(() => handle.createWritable());
      } catch (error) {
        if (error instanceof StopSignal) throw error;
        return settle(node, "failed", `couldn't write: ${errorText(error)}`);
      }
      item.attempt = 1;
      item.phase = "transferring";
      notify();

      async function discardAndReset() {
        await diskOp(() => writable.truncate(0));
        item.received = 0;
      }

      // Same shape as transfer()'s own retryOrFail, but attemptStartReceived
      // is always item.received itself: a Native File never resumes, so an
      // Attempt is never credited for "progress" (see CONTEXT.md's Attempt).
      async function retryOrFail(error) {
        let outcome;
        try {
          outcome = await handleFailure(item, error, item.received);
        } catch (stopError) {
          await abandon(item, writable, folder, onDiskName, created);
          throw stopError;
        }
        if (outcome.giveUp) {
          await cleanupWritable(writable, folder, onDiskName, created);
          settle(node, "failed", errorText(error));
          return null;
        }
        return outcome;
      }

      for (;;) {
        try {
          await checkpoint();
          await diskOp(() => exportNativeFile(node, item, writable));
        } catch (error) {
          const stopping =
            error instanceof StopSignal ||
            (error && error.name === "AbortError" && run.status === "stopping");
          if (stopping) {
            await abandon(item, writable, folder, onDiskName, created);
            throw new StopSignal();
          }
          if (error && error.name === "AbortError") {
            // Our own Pause interrupted the export: nothing here can be
            // resumed, so the bytes are discarded and Resume starts the
            // whole export again - no Attempt spent either way.
            try {
              await discardAndReset();
            } catch (stopError) {
              await abandon(item, writable, folder, onDiskName, created);
              throw stopError;
            }
            run.status = "paused";
            notify();
            await wait();
            if (run.status === "stopping") {
              await abandon(item, writable, folder, onDiskName, created);
              throw new StopSignal();
            }
            item.phase = "transferring";
            notify();
            continue;
          }
          if (error.transient === false) {
            await cleanupWritable(writable, folder, onDiskName, created);
            return settle(node, "failed", errorText(error));
          }
          const outcome = await retryOrFail(error);
          if (!outcome) return;
          try {
            await discardAndReset();
          } catch (stopError) {
            await abandon(item, writable, folder, onDiskName, created);
            throw stopError;
          }
          item.phase = "transferring";
          notify();
          continue;
        }

        item.phase = "finalizing";
        notify();
        try {
          await diskOp(() => writable.close());
        } catch (error) {
          if (error instanceof StopSignal) {
            await abandon(item, writable, folder, onDiskName, created);
            throw error;
          }
          await cleanupWritable(writable, folder, onDiskName, created);
          return settle(node, "failed", errorText(error));
        }
        let file;
        try {
          file = await handle.getFile();
        } catch (error) {
          return settle(node, "failed", `couldn't check: ${errorText(error)}`);
        }
        putLocalFile(folder.local, {
          name: onDiskName,
          size: file.size,
          modified: file.lastModified,
        });
        return settle(node, "done");
      }
    }

    async function runFile(node, folder, blockedReason) {
      // loop and unsupported settle with their own status, not "failed"
      // - see unfetchableReason's own note.
      if (node.loop) return settle(node, "loop");
      if (node.unsupported) return settle(node, "unsupported");
      const reason = unfetchableReason(node) || blockedReason;
      if (reason) return settle(node, "failed", reason);
      const item = run.items.get(node.id);
      const name = localNames.get(node.id);
      run.current = {
        id: node.id,
        path: joinPath(folder.path, name),
        size: node.size,
      };
      item.status = "downloading";
      item.phase = "checking";
      notify();
      let existing;
      let size = null;
      try {
        existing = await diskOp(() => findOnDisk(folder.dir, name));
        if (existing && existing.kind === "file") {
          const file = await diskOp(() => existing.getFile());
          size = file.size;
          putLocalFile(folder.local, {
            name: existing.name,
            size,
            modified: file.lastModified,
          });
        }
      } catch (error) {
        if (error instanceof StopSignal) throw error;
        return settle(
          node,
          "failed",
          `couldn't check the Target Folder: ${errorText(error)}`,
        );
      }
      if (existing && existing.kind === "directory") {
        return skipExisting
          ? settle(node, "exists")
          : settle(
              node,
              "failed",
              `a folder named ${existing.name} is in the way`,
            );
      }
      // A 0-byte local file is a leftover, missing unless Drive's is empty.
      const emptyLeftover = size === 0 && node.size !== 0;
      item.overwrite = !!existing && !emptyLeftover;
      if (item.overwrite) {
        // The real on-disk size, so a skipped Native File shows it
        // instead of "?" forever (ticket 12's knownFileSize) - only on
        // the two paths that actually settle "exists" here; the
        // fall-through to transfer()/transferNative() below must start
        // item.received at 0, not the old file's size.
        if (skipExisting) {
          item.received = size;
          return settle(node, "exists");
        }
        if (!knownExisting.has(node.id)) {
          item.received = size;
          return settle(node, "exists", "appeared after Download was pressed");
        }
      }
      run.current.path = joinPath(folder.path, existing ? existing.name : name);
      const onDiskName = existing ? existing.name : name;
      if (NATIVE_FILE_EXPORTS[node.mimeType])
        await transferNative(node, item, folder, onDiskName, !existing);
      else await transfer(node, item, folder, onDiskName, !existing);
    }

    // Opens (reusing, ignoring case) or creates a folder's local twin.
    async function openFolder(parent, name) {
      const existing = await diskOp(() => findOnDisk(parent.dir, name));
      const onDisk = existing ? existing.name : name;
      const dir = await diskOp(() =>
        parent.dir.getDirectoryHandle(onDisk, { create: true }),
      );
      return {
        dir,
        local: putLocalFolder(parent.local, onDisk),
        path: joinPath(parent.path, onDisk),
      };
    }

    // parent: the folder's parent on disk ({ dir, local, path }), or null
    // when it wasn't created; blockedReason fails every file below.
    async function runFolder(node, parent, blockedReason) {
      let here = null;
      if (!blockedReason && parent && wantsFolder(node, unselected)) {
        try {
          here = await openFolder(parent, localNames.get(node.id));
          notify();
        } catch (error) {
          if (error instanceof StopSignal) throw error;
          blockedReason = FOLDER_NOT_CREATED;
        }
      }
      for (const child of node.children) {
        await checkpoint();
        if (child.children) await runFolder(child, here, blockedReason);
        else if (!unselected.has(child.id))
          await runFile(child, here, blockedReason);
      }
    }

    try {
      await refreshToken();
    } catch {
      // Retried before the first chunk, like any other transient failure
      // (a failed token fetch is one of the Attempts - see ticket 09).
    }
    try {
      await runFolder(
        tree,
        { dir: targetHandle, local: target, path: "" },
        null,
      );
    } catch (error) {
      if (!(error instanceof StopSignal)) throw error;
    }
    run.current = null;
    run.status = "finished";
    notify();
  }
</script>
