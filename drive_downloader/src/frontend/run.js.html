<script>
  /* global compareNames, formatBytes, errorText */
  // Run engine: mirrors the Tree into the Target Folder one file at a time,
  // in Tree order, streaming each normal file from the Drive API in byte
  // ranges into a writable. Reaches the outside world only through the
  // io ports it is handed (see docs/adr/0001-client-side-core.md).
  //
  // A Run is { items, current, token, tokenAt, status }: items maps each
  // file Item's id to { status, received, phase, reason }, status one of
  // pending / downloading / done / exists / failed, phase (while
  // downloading) checking / transferring / finalizing; current is
  // { id, path, size } of the file in hand, path its Local Name path under
  // the Target Folder; status is the Run's own state (see below),
  // pauseMessage the reason a disk error paused it, if any. runDownload
  // attaches pause()/resume()/stop() commands onto the Run object.
  //
  // Run status: running -> pausing (Pause pressed, or a disk error) ->
  // paused -> running (Resume), or -> stopping (Stop pressed) -> finished.
  // "pausing" only lasts until the nearest checkpoint notices it, since
  // most disk/network operations can't be interrupted mid-call. No
  // Attempts yet: any other failure fails the file (see ticket 09).
  const DRIVE_FILES_URL = "https://www.googleapis.com/drive/v3/files";
  const DEFAULT_CHUNK_SIZE = 128 * 1024 * 1024;
  const TOKEN_MAX_AGE_MS = 10 * 60 * 1000;
  const GOOGLE_APPS_MIME_PREFIX = "application/vnd.google-apps.";
  const FOLDER_NOT_CREATED = "folder could not be created";

  // Thrown to unwind the whole Tree walk once Stop has been handled at the
  // point it was noticed; never a real failure.
  class StopSignal {}

  // The message a disk error pauses the Run with, or null when error isn't
  // one: not enough space, lost permission, or the Target Folder itself
  // gone.
  function diskErrorMessage(error) {
    const name = error && error.name;
    if (name === "QuotaExceededError")
      return "Not enough free disk space. Free up space, then press Resume.";
    if (name === "NotFoundError")
      return "The Target Folder was moved or deleted. Choose it again, then press Resume.";
    if (name === "NotAllowedError" || name === "SecurityError")
      return "Lost permission to the Target Folder. Press Resume to allow it again.";
    return null;
  }

  function createRun(tree, unselected) {
    const items = new Map();
    (function walk(node) {
      for (const child of node.children) {
        if (child.children) walk(child);
        else
          items.set(
            child.id,
            unselected && unselected.has(child.id)
              ? { status: "unselected", received: 0 }
              : { status: "pending", received: 0 },
          );
      }
    })(tree);
    return { items, current: null, token: null, tokenAt: 0, status: null };
  }

  // Why the Run won't fetch a file, or null when it will. Only normal
  // files are fetched so far; Native Files and Shortcuts come later.
  function unfetchableReason(node) {
    if (node.canDownload === false) return "downloads disabled by owner";
    if (node.mimeType.startsWith(GOOGLE_APPS_MIME_PREFIX))
      return "this file type can't be downloaded yet";
    return null;
  }

  // A folder is created only if it is empty in Drive or holds, somewhere
  // below, a ticked file the Run will fetch. An empty folder is created
  // regardless of ticking: there is nothing under it to untick.
  function wantsFolder(node, unselected) {
    return (
      node.children.length === 0 ||
      node.children.some((child) =>
        child.children
          ? wantsFolder(child, unselected)
          : !unselected.has(child.id) && !unfetchableReason(child),
      )
    );
  }

  // The entry on disk a Local Name maps to, ignoring case: the exact-case
  // one if present, else the first in name order (as the merge pairs them).
  async function findOnDisk(dirHandle, name) {
    const lower = name.toLowerCase();
    const found = [];
    for await (const entry of dirHandle.values()) {
      if (entry.name.toLowerCase() === lower) found.push(entry);
    }
    return (
      found.find((entry) => entry.name === name) ||
      found.sort((a, b) => compareNames(a.name, b.name))[0] ||
      null
    );
  }

  // Keeps the scanned local tree in step with what the Run finds and
  // writes, so the Target Folder rows update without a re-read.
  function putLocalFolder(localFolder, name) {
    const existing = localFolder.children.find(
      (c) => c.name === name && c.isFolder,
    );
    if (existing) return existing;
    const created = { name, isFolder: true, children: [] };
    localFolder.children.push(created);
    return created;
  }

  function putLocalFile(localFolder, entry) {
    const i = localFolder.children.findIndex((c) => c.name === entry.name);
    const local = { ...entry, isFolder: false };
    if (i >= 0) localFolder.children[i] = local;
    else localFolder.children.push(local);
  }

  function joinPath(parentPath, name) {
    return parentPath ? `${parentPath}/${name}` : name;
  }

  async function driveErrorText(res) {
    let reason = "";
    try {
      const body = await res.json();
      const first = body.error.errors && body.error.errors[0];
      reason = (first && first.reason) || body.error.message || "";
    } catch {
      // Not a Drive JSON error; the status alone will do.
    }
    return `Drive answered HTTP ${res.status}${reason ? ` (${reason})` : ""}`;
  }

  // localNames: id -> Local Name (see naming.js). unselected: ids of files
  // the user has unticked (see tree.js); already reflected in run.items'
  // starting statuses, but wantsFolder needs it directly too. io: {
  // fetch(url, init) (the Drive port), getToken() -> token (the Server
  // port), now() -> epoch ms, chunkSize, onChange() }.
  async function runDownload(
    run,
    tree,
    localNames,
    unselected,
    targetHandle,
    target,
    io,
  ) {
    const chunkSize = io.chunkSize || DEFAULT_CHUNK_SIZE;
    const notify = () => io.onChange && io.onChange();

    run.status = "running";
    run.pauseMessage = null;
    run.diskPause = false;
    let wake = null; // resolves the current pause/disk-error wait, if any
    let activeAbort = null; // the in-flight Drive fetch's AbortController

    function wait() {
      return new Promise((resolve) => {
        wake = resolve;
      });
    }

    // Called between units of work (before each Item, before each chunk):
    // ends the Run at once if Stop was requested, or blocks here until
    // Resume if Pause was.
    async function checkpoint() {
      if (run.status === "stopping") throw new StopSignal();
      if (run.status !== "pausing") return;
      run.status = "paused";
      notify();
      await wait();
      if (run.status === "stopping") throw new StopSignal();
    }

    // Retries a disk operation, pausing the Run on a disk error (full
    // disk, lost permission, Target Folder moved or deleted) until
    // Resume, which re-requests permission first; any other error (or a
    // Stop while paused) passes straight through.
    async function diskOp(fn) {
      for (;;) {
        try {
          return await fn();
        } catch (error) {
          if (error instanceof StopSignal) throw error;
          const message = diskErrorMessage(error);
          if (!message) throw error;
          run.status = "paused";
          run.pauseMessage = message;
          run.diskPause = true;
          notify();
          await wait();
          if (run.status === "stopping") throw new StopSignal();
        }
      }
    }

    run.pause = () => {
      if (run.status !== "running") return;
      run.status = "pausing";
      if (activeAbort) activeAbort.abort();
      notify();
    };

    // Chrome only allows requestPermission from a user gesture, so a
    // disk-error pause re-requests it here, on the Resume click itself.
    run.resume = async () => {
      if (run.status !== "paused" && run.status !== "pausing") return;
      if (run.diskPause) {
        try {
          await targetHandle.requestPermission({ mode: "readwrite" });
        } catch {
          // The retried disk operation will fail the same way and pause
          // again if permission is still refused.
        }
      }
      run.diskPause = false;
      run.pauseMessage = null;
      const w = wake;
      wake = null;
      run.status = "running";
      notify();
      if (w) w();
    };

    run.stop = () => {
      if (run.status === "stopping" || run.status === "finished") return;
      run.status = "stopping";
      run.pauseMessage = null;
      if (activeAbort) activeAbort.abort();
      notify();
      const w = wake;
      wake = null;
      if (w) w();
    };

    function settle(node, status, reason) {
      const item = run.items.get(node.id);
      item.status = status;
      item.phase = null;
      if (reason) item.reason = reason;
      run.current = null;
      notify();
    }

    // Aborts the writable and, for a file the Run itself created, removes
    // the partial entry it leaves behind; an overwritten file's original
    // bytes are untouched (the writable never held them).
    async function cleanupWritable(writable, folder, onDiskName, created) {
      try {
        await writable.abort();
      } catch {
        // Already closed or broken; nothing left to discard.
      }
      if (created) {
        try {
          await folder.dir.removeEntry(onDiskName);
        } catch {
          // Leaves an empty file, which a later Run treats as missing.
        }
      }
    }

    async function refreshToken() {
      try {
        run.token = await io.getToken();
      } catch (error) {
        run.token = null;
        throw new Error(`couldn't get a Drive token: ${errorText(error)}`, {
          cause: error,
        });
      }
      run.tokenAt = io.now();
    }

    async function send(node, range, signal) {
      const headers = { Authorization: `Bearer ${run.token}`, Range: range };
      if (node.resourceKey)
        headers["X-Goog-Drive-Resource-Keys"] =
          `${node.id}/${node.resourceKey}`;
      try {
        return await io.fetch(
          `${DRIVE_FILES_URL}/${encodeURIComponent(node.id)}?alt=media&supportsAllDrives=true`,
          { headers, signal },
        );
      } catch (error) {
        if (error && error.name === "AbortError") throw error;
        throw new Error(`network error: ${errorText(error)}`, {
          cause: error,
        });
      }
    }

    // One ranged request, token kept fresh: refreshed first when older
    // than 10 minutes, and on a 401 the same range is asked again once.
    // The AbortController stays live for the whole request, headers
    // through body, so Pause/Stop can abort it at any point.
    async function fetchRange(node, range) {
      if (!run.token || io.now() - run.tokenAt > TOKEN_MAX_AGE_MS)
        await refreshToken();
      const controller = new AbortController();
      activeAbort = controller;
      let res = await send(node, range, controller.signal);
      if (res.status === 401) {
        await refreshToken();
        res = await send(node, range, controller.signal);
      }
      if (!res.ok) throw new Error(await driveErrorText(res));
      return res;
    }

    async function transferChunk(node, item, writable) {
      const start = item.received;
      const end = Math.min(start + chunkSize, node.size) - 1;
      try {
        const res = await fetchRange(node, `bytes=${start}-${end}`);
        if (res.status !== 206 && start > 0)
          throw new Error("Drive ignored the byte range");
        const reader = res.body.getReader();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          await writable.write(value);
          item.received += value.byteLength;
          notify();
        }
        if (item.received <= end)
          throw new Error("Drive sent fewer bytes than asked for");
      } finally {
        activeAbort = null;
      }
    }

    // Stop's cleanup: aborts the writable (and removes it, if the Run made
    // it), then puts the file back to pending, same as one never reached.
    async function abandon(item, writable, folder, onDiskName, created) {
      await cleanupWritable(writable, folder, onDiskName, created);
      item.status = "pending";
      item.phase = null;
      item.received = 0;
      run.current = null;
      notify();
    }

    // Writes one file under onDiskName; created says the Run made the file,
    // so a failure removes it rather than leaving an empty one behind.
    async function transfer(node, item, folder, onDiskName, created) {
      let handle;
      let writable;
      try {
        handle = await diskOp(() =>
          folder.dir.getFileHandle(onDiskName, { create: true }),
        );
        writable = await diskOp(() => handle.createWritable());
      } catch (error) {
        if (error instanceof StopSignal) throw error;
        return settle(node, "failed", `couldn't write: ${errorText(error)}`);
      }
      item.phase = "transferring";
      notify();
      for (;;) {
        try {
          while (item.received < node.size) {
            await checkpoint();
            await diskOp(() => transferChunk(node, item, writable));
          }
          break;
        } catch (error) {
          const stopping =
            error instanceof StopSignal ||
            (error && error.name === "AbortError" && run.status === "stopping");
          if (stopping) {
            await abandon(item, writable, folder, onDiskName, created);
            throw new StopSignal();
          }
          if (error && error.name === "AbortError") {
            // Our own Pause interrupted the fetch; keep the writable and
            // resume from the same byte once the user presses Resume.
            run.status = "paused";
            notify();
            await wait();
            if (run.status === "stopping") {
              await abandon(item, writable, folder, onDiskName, created);
              throw new StopSignal();
            }
            continue;
          }
          await cleanupWritable(writable, folder, onDiskName, created);
          return settle(node, "failed", errorText(error));
        }
      }
      item.phase = "finalizing";
      notify();
      try {
        await diskOp(() => writable.close());
      } catch (error) {
        if (error instanceof StopSignal) {
          await abandon(item, writable, folder, onDiskName, created);
          throw error;
        }
        await cleanupWritable(writable, folder, onDiskName, created);
        return settle(node, "failed", errorText(error));
      }
      let file;
      try {
        file = await handle.getFile();
      } catch (error) {
        return settle(node, "failed", `couldn't check: ${errorText(error)}`);
      }
      putLocalFile(folder.local, {
        name: onDiskName,
        size: file.size,
        modified: file.lastModified,
      });
      if (file.size !== node.size) {
        return settle(
          node,
          "failed",
          `size on disk (${formatBytes(file.size)}) doesn't match Drive (${formatBytes(node.size)})`,
        );
      }
      settle(node, "done");
    }

    async function runFile(node, folder, blockedReason) {
      const reason = unfetchableReason(node) || blockedReason;
      if (reason) return settle(node, "failed", reason);
      const item = run.items.get(node.id);
      const name = localNames.get(node.id);
      run.current = {
        id: node.id,
        path: joinPath(folder.path, name),
        size: node.size,
      };
      item.status = "downloading";
      item.phase = "checking";
      notify();
      let existing;
      let size = null;
      try {
        existing = await diskOp(() => findOnDisk(folder.dir, name));
        if (existing && existing.kind === "file") {
          const file = await diskOp(() => existing.getFile());
          size = file.size;
          putLocalFile(folder.local, {
            name: existing.name,
            size,
            modified: file.lastModified,
          });
        }
      } catch (error) {
        if (error instanceof StopSignal) throw error;
        return settle(
          node,
          "failed",
          `couldn't check the Target Folder: ${errorText(error)}`,
        );
      }
      // A 0-byte local file is a leftover, missing unless Drive's is empty.
      const emptyLeftover = size === 0 && node.size !== 0;
      if (existing && !emptyLeftover) return settle(node, "exists");
      run.current.path = joinPath(folder.path, existing ? existing.name : name);
      await transfer(
        node,
        item,
        folder,
        existing ? existing.name : name,
        !existing,
      );
    }

    // Opens (reusing, ignoring case) or creates a folder's local twin.
    async function openFolder(parent, name) {
      const existing = await diskOp(() => findOnDisk(parent.dir, name));
      const onDisk = existing ? existing.name : name;
      const dir = await diskOp(() =>
        parent.dir.getDirectoryHandle(onDisk, { create: true }),
      );
      return {
        dir,
        local: putLocalFolder(parent.local, onDisk),
        path: joinPath(parent.path, onDisk),
      };
    }

    // parent: the folder's parent on disk ({ dir, local, path }), or null
    // when it wasn't created; blockedReason fails every file below.
    async function runFolder(node, parent, blockedReason) {
      let here = null;
      if (!blockedReason && parent && wantsFolder(node, unselected)) {
        try {
          here = await openFolder(parent, localNames.get(node.id));
          notify();
        } catch (error) {
          if (error instanceof StopSignal) throw error;
          blockedReason = FOLDER_NOT_CREATED;
        }
      }
      for (const child of node.children) {
        await checkpoint();
        if (child.children) await runFolder(child, here, blockedReason);
        else if (!unselected.has(child.id))
          await runFile(child, here, blockedReason);
      }
    }

    try {
      await refreshToken();
    } catch {
      // Asked again before the first chunk; that failure fails the file.
    }
    try {
      await runFolder(
        tree,
        { dir: targetHandle, local: target, path: "" },
        null,
      );
    } catch (error) {
      if (!(error instanceof StopSignal)) throw error;
    }
    run.current = null;
    run.status = "finished";
    notify();
  }
</script>
