<script>
  /* global createController, escapeHtml */
  // Disk Window view: thin DOM wiring, not unit-tested (see
  // docs/adr/0001-client-side-core.md). The Server port reaches GAS only
  // through the Launcher Page's bridge, over window.opener.
  function serverPort(fn, ...args) {
    return window.opener.ddServer(fn, ...args);
  }

  // The remembered Target Folder handle lives in IndexedDB (handles can't
  // go in localStorage).
  function handleDbRequest(mode, fn) {
    return new Promise((resolve, reject) => {
      const open = indexedDB.open("driveDownloader", 1);
      open.onupgradeneeded = () => open.result.createObjectStore("handles");
      open.onerror = () => reject(open.error);
      open.onsuccess = () => {
        const db = open.result;
        try {
          const tx = db.transaction("handles", mode);
          const req = fn(tx.objectStore("handles"));
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
          tx.oncomplete = () => db.close();
        } catch (error) {
          // e.g. DataCloneError from put(): throws here, not via onerror.
          db.close();
          reject(error);
        }
      };
    });
  }

  const handleStore = {
    get: () => handleDbRequest("readonly", (s) => s.get("target")),
    set: (handle) =>
      handleDbRequest("readwrite", (s) => s.put(handle, "target")),
  };

  function pickDirectory(startIn) {
    return window.showDirectoryPicker({ mode: "readwrite", startIn });
  }

  // Scan progress can tick thousands of times; render once per frame.
  let renderQueued = false;
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => {
      renderQueued = false;
      render();
    });
  }

  const controller = createController(serverPort, localStorage, {
    pickDirectory,
    handleStore,
    fetch: (url, init) => window.fetch(url, init),
    onChange: scheduleRender,
    wakeLock:
      "wakeLock" in navigator
        ? { request: () => navigator.wakeLock.request("screen") }
        : undefined,
    onVisible: (fn) => {
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") fn();
      });
    },
    setTimeout: (fn, ms) => window.setTimeout(fn, ms),
    clearTimeout: (id) => window.clearTimeout(id),
    isOnline: () => navigator.onLine,
    onOnline: (fn) => {
      window.addEventListener("online", fn);
      return () => window.removeEventListener("online", fn);
    },
  });

  // Ends a Run rather than let it survive a reload (Run state lives in
  // memory only); the Launcher Page checks this before its own unload.
  window.ddRunActive = () =>
    ["running", "paused", "stopping"].includes(
      controller.getViewModel().runState,
    );

  window.addEventListener("beforeunload", (e) => {
    if (!window.ddRunActive()) return;
    e.preventDefault();
    e.returnValue = "";
  });

  controller.checkToken();

  // Closes itself if the Launcher Page (its opener) is gone; there is no
  // window event for "opener closed", so this polls.
  setInterval(() => {
    if (!window.opener || window.opener.closed) window.close();
  }, 1000);

  const sourceUrlInput = document.getElementById("source-url");
  const readDriveButton = document.getElementById("read-drive");
  const locationButton = document.getElementById("choose-location");
  const refreshButton = document.getElementById("refresh-target");
  const skipExistingInput = document.getElementById("skip-existing");
  const replaceSpacesInput = document.getElementById("replace-spaces");
  const useShortcutTargetNamesInput = document.getElementById(
    "use-shortcut-target-names",
  );
  const keepAwakeInput = document.getElementById("keep-awake");
  const downloadButton = document.getElementById("download");
  const pauseButton = document.getElementById("pause");
  const resumeButton = document.getElementById("resume");
  const stopButton = document.getElementById("stop");
  const expandAllButton = document.getElementById("expand-all");
  const collapseAllButton = document.getElementById("collapse-all");
  const overallEl = document.getElementById("overall");
  const treeEl = document.getElementById("tree");
  const busyEl = document.getElementById("busy");
  const statusErrorsEl = document.getElementById("status-errors");
  const statusTextEl = document.getElementById("status-text");
  const confirmOverwriteEl = document.getElementById("confirm-overwrite");
  const confirmOverwriteTextEl = document.getElementById(
    "confirm-overwrite-text",
  );

  const HATCHED = '<span class="hatched"></span>'.repeat(3);
  const BLANK = "<span></span>".repeat(3);

  // Tooltip targets (see tooltip.js): data-tip the text, data-tip-delay
  // when it shows, data-tip-key the row and cell, so a tip survives its
  // row being re-rendered under the pointer.
  const NAME_TIP_DELAY = 1000;
  const CELL_TIP_DELAY = 2000;
  function tipAttrs(tip) {
    if (!tip) return "";
    return ` data-tip="${escapeHtml(tip.text)}" data-tip-delay="${tip.delay}" data-tip-key="${escapeHtml(tip.key)}"`;
  }

  // The attribute marking a folder's toggle targets (the arrow and the
  // label), or "" for a row that has nothing to expand.
  function toggleAttr(row, attr, id) {
    if (!row.isFolder || !row.hasChildren || id == null) return "";
    return ` ${attr}="${escapeHtml(id)}"`;
  }

  function toggleHtml(row, attr, id) {
    const marked = toggleAttr(row, attr, id);
    if (!marked) return '<span class="tree-toggle"></span>';
    return `<span class="tree-toggle"${marked}>${row.collapsed ? "&#9656;" : "&#9662;"}</span>`;
  }

  // A folder's icon and name: toggles it like the arrow. Wraps only the
  // label, so the checkbox beside it keeps its own click.
  function labelHtml(row, attr, id, text, tip) {
    return `<span class="tree-label"${toggleAttr(row, attr, id)}${tipAttrs(tip)}>${text}</span>`;
  }

  // A row's selection checkbox: ticked/mixed/unticked from selectionState,
  // disabled while a Run holds the plan fixed or the Item can't be
  // downloaded (indeterminate is a DOM property, set after render).
  function checkboxHtml(row, locked) {
    const checked = row.selectionState === "checked" ? " checked" : "";
    const mixed = row.selectionState === "mixed" ? " data-indeterminate" : "";
    const disabled = locked || row.selectionDisabled ? " disabled" : "";
    return `<input type="checkbox" class="sel-box" data-sel="${escapeHtml(row.id)}"${checked}${mixed}${disabled}>`;
  }

  function barHtml(fraction) {
    return `<span class="bar"><i style="width:${Math.round(fraction * 100)}%"></i></span>`;
  }

  // A file's Status cell: a bar with bytes while downloading, else its
  // Item Status chip; the Status tip carries the rest.
  function statusHtml(row) {
    const tip = tipAttrs({
      text: row.statusTip,
      delay: CELL_TIP_DELAY,
      key: `${row.id}:status`,
    });
    if (row.isFolder)
      return `<small${tip}>${escapeHtml(row.statusText)}</small>`;
    if (row.progress) {
      return (
        `<span class="status"${tip}>` +
        `${barHtml(row.progress.fraction)}<small>${escapeHtml(row.progress.text)}</small></span>`
      );
    }
    return `<span class="chip ${escapeHtml(row.statusText)}"${tip}>${escapeHtml(row.statusText)}</span>`;
  }

  function leftCells(row, selectionLocked) {
    const nameTip = {
      text: row.nameTip,
      delay: NAME_TIP_DELAY,
      key: `${row.id}:name`,
    };
    const name =
      `<span class="tree-name ${row.isFolder ? "folder" : ""}" style="padding-left:${row.depth * 16}px">` +
      `${toggleHtml(row, "data-toggle", row.id)}${checkboxHtml(row, selectionLocked)}${labelHtml(row, "data-toggle", row.id, `${row.isShortcut ? "↪ " : ""}${row.isFolder ? "📁" : "📄"} ${escapeHtml(row.name)}`, nameTip)}</span>`;
    return (
      name +
      `<span class="tree-size">${escapeHtml(row.sizeText)}</span>` +
      statusHtml(row)
    );
  }

  // key: the row's identity for tooltip tracking (see tooltip.js).
  function rightCells(row, key) {
    const [attr, id] =
      row.driveToggle != null
        ? ["data-toggle", row.driveToggle]
        : ["data-local-toggle", row.localToggle];
    const toggle = toggleHtml(row, attr, id);
    const nameClass = [
      "tree-name",
      row.isFolder ? "folder" : "",
      row.planned ? "planned" : "",
      row.result === "local only" ? "local-only" : "",
    ].join(" ");
    const name =
      `<span class="${nameClass}" style="padding-left:${row.depth * 16}px">` +
      `${toggle}${labelHtml(row, attr, id, `${row.isFolder ? "📁" : "📄"} ${escapeHtml(row.name)}`, { text: row.nameTip, delay: NAME_TIP_DELAY, key: `${key}:name` })}</span>`;
    const resultTip = tipAttrs({
      text: row.resultTip,
      delay: CELL_TIP_DELAY,
      key: `${key}:result`,
    });
    const result = `<span class="chip ${row.result.replace(/ /g, "-")}"${resultTip}>${escapeHtml(row.result)}</span>`;
    return (
      name +
      `<span class="tree-size ${row.planned ? "planned" : ""}">${escapeHtml(row.sizeText)}</span>` +
      result
    );
  }

  function targetHeaderHtml(vm) {
    return vm.targetFolderName == null
      ? 'Target Folder <span class="muted">No folder chosen</span>'
      : `Target Folder 📁 ${escapeHtml(vm.targetFolderName)}`;
  }

  // The tree's row elements as last rendered, by their markup; a frame
  // replaces only the rows whose markup changed, so a row under the
  // pointer (a toggle being pressed, a tooltip target) stays in the DOM
  // while a file transfers.
  let renderedRows = [];

  function patchTree(htmls) {
    const common = Math.min(renderedRows.length, htmls.length);
    for (let i = 0; i < common; i++) {
      if (renderedRows[i] === htmls[i]) continue;
      const holder = document.createElement("template");
      holder.innerHTML = htmls[i];
      treeEl.children[i].replaceWith(holder.content.firstElementChild);
    }
    while (treeEl.children.length > htmls.length) {
      treeEl.lastElementChild.remove();
    }
    treeEl.insertAdjacentHTML("beforeend", htmls.slice(common).join(""));
    renderedRows = htmls;
  }

  // A right-side row's tooltip key: its Drive row's id, or for a local-only
  // item its depth and name.
  function rightKey(row) {
    return row.left
      ? row.left.id
      : `local:${row.right.depth}:${row.right.name}`;
  }

  function renderTree(vm) {
    if (vm.rows.length === 0 && !vm.hasLocation) {
      treeEl.innerHTML = "";
      renderedRows = [];
      return;
    }
    const groups =
      '<div class="tree-row header group">' +
      '<span class="span-3">Google Drive</span>' +
      '<span class="gutter"></span>' +
      `<span class="span-3">${targetHeaderHtml(vm)}</span></div>`;
    const columns =
      '<div class="tree-row header"><span>Name</span>' +
      '<span class="tree-size">Size</span><span>Status</span><span class="gutter"></span>' +
      '<span>Name</span><span class="tree-size">Size</span><span>Result</span></div>';
    const body = vm.rows.map((row) => {
      const left = row.left ? leftCells(row.left, vm.selectionLocked) : HATCHED;
      const right = row.right
        ? rightCells(row.right, rightKey(row))
        : vm.hasTarget
          ? HATCHED
          : BLANK;
      return `<div class="tree-row">${left}<span class="gutter"></span>${right}</div>`;
    });
    patchTree([groups, columns, ...body]);
    // The mixed state is a DOM property, not an attribute.
    treeEl
      .querySelectorAll("[data-indeterminate]")
      .forEach((el) => (el.indeterminate = true));
    window.ddTipSync();
  }

  function render() {
    const vm = controller.getViewModel();
    sourceUrlInput.disabled = vm.urlDisabled;
    readDriveButton.disabled = vm.readDisabled;
    locationButton.disabled = vm.locationDisabled;
    skipExistingInput.disabled = vm.optionsDisabled;
    skipExistingInput.checked = vm.skipExisting;
    replaceSpacesInput.disabled = vm.optionsDisabled;
    replaceSpacesInput.checked = vm.replaceSpaces;
    useShortcutTargetNamesInput.disabled = vm.optionsDisabled;
    useShortcutTargetNamesInput.checked = vm.useShortcutTargetNames;
    keepAwakeInput.checked = vm.keepAwake;
    downloadButton.disabled = vm.downloadDisabled;
    pauseButton.disabled = vm.pauseDisabled;
    resumeButton.disabled = vm.resumeDisabled;
    stopButton.disabled = vm.stopDisabled;
    expandAllButton.disabled = vm.expandCollapseDisabled;
    collapseAllButton.disabled = vm.expandCollapseDisabled;
    overallEl.hidden = !vm.overall;
    if (vm.overall) {
      overallEl.querySelector("i").style.width =
        `${Math.round(vm.overall.fraction * 100)}%`;
      overallEl.querySelector("small").textContent =
        `Overall ${vm.overall.text}`;
    }
    refreshButton.disabled = vm.refreshDisabled;
    statusErrorsEl.replaceChildren(
      ...vm.statusErrors.map((message) => {
        const line = document.createElement("p");
        line.textContent = message;
        return line;
      }),
    );
    busyEl.hidden = vm.busyIndicator === "none";
    busyEl.className = `busy ${vm.busyIndicator}`;
    busyEl.textContent = vm.busyIndicator === "paused" ? "⏸️" : "";
    const busyLabel = vm.busyIndicator === "paused" ? "On hold" : "Working…";
    busyEl.setAttribute("aria-label", busyLabel);
    statusTextEl.textContent = vm.statusText;
    statusTextEl.classList.toggle("error", !!vm.pauseMessage);
    confirmOverwriteEl.hidden = vm.confirmOverwriteCount === null;
    if (vm.confirmOverwriteCount !== null) {
      confirmOverwriteTextEl.textContent = `${vm.confirmOverwriteCount} existing files will be overwritten. Continue?`;
    }
    renderTree(vm);
  }

  sourceUrlInput.value = controller.getViewModel().url;

  sourceUrlInput.addEventListener("input", (e) => {
    controller.setUrl(e.target.value);
    render();
  });

  readDriveButton.addEventListener("click", () => {
    controller.readDrive().then(render);
    render();
  });

  locationButton.addEventListener("click", () => {
    controller.chooseLocation().then(render);
    render();
  });

  refreshButton.addEventListener("click", () => {
    controller.refreshTarget().then(render);
    render();
  });

  skipExistingInput.addEventListener("change", (e) => {
    controller.setSkipExisting(e.target.checked);
    render();
  });

  replaceSpacesInput.addEventListener("change", (e) => {
    controller.setReplaceSpaces(e.target.checked);
    render();
  });

  useShortcutTargetNamesInput.addEventListener("change", (e) => {
    controller.setUseShortcutTargetNames(e.target.checked);
    render();
  });

  downloadButton.addEventListener("click", () => {
    controller.download().then(render);
    render();
  });

  pauseButton.addEventListener("click", () => {
    controller.pause().then(render);
    render();
  });

  resumeButton.addEventListener("click", () => {
    controller.resume().then(render);
    render();
  });

  stopButton.addEventListener("click", () => {
    controller.stop();
    render();
  });

  expandAllButton.addEventListener("click", () => {
    controller.expandAll();
    render();
  });

  collapseAllButton.addEventListener("click", () => {
    controller.collapseAll();
    render();
  });

  keepAwakeInput.addEventListener("change", (e) => {
    controller.setKeepAwake(e.target.checked).then(render);
    render();
  });

  document
    .getElementById("confirm-overwrite-continue")
    .addEventListener("click", () => {
      controller.confirmOverwrite().then(render);
      render();
    });

  document
    .getElementById("confirm-overwrite-cancel")
    .addEventListener("click", () => {
      controller.cancelOverwrite();
      render();
    });

  treeEl.addEventListener("click", (e) => {
    const selId = e.target.closest("[data-sel]")?.dataset.sel;
    if (selId != null) {
      controller.toggleSelected(selId);
      render();
    }
  });

  // Folder toggles (arrow, icon, name) fire on pointerdown (primary button
  // only), not click: a Run re-renders the Tree about once per frame while
  // a file transfers, and by mouseup the span pressed on mousedown is
  // already gone, so click never reaches this element (ticket 17). The
  // checkbox is no toggle target; it keeps its own click.
  treeEl.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    const driveId = e.target.closest("[data-toggle]")?.dataset.toggle;
    const localPath = e.target.closest("[data-local-toggle]")?.dataset
      .localToggle;
    if (driveId != null) controller.toggleCollapsed(driveId);
    else if (localPath != null) controller.toggleLocalFolder(localPath);
    else return;
    render();
  });

  controller.restoreLocation().then(render);
  render();
</script>
